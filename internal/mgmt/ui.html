<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nodescale-ui</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --fg: #1b1f24;
    --muted: #5c6672;
    --line: #dfe3e8;
    --ok: #1e7b34;
    --warn: #b35c00;
    --high: #b3261e;
    --accent: #14539a;
    --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --card: #1c2024;
      --fg: #e6e9ee;
      --muted: #9aa4b0;
      --line: #2b3138;
      --ok: #4ec26a;
      --warn: #f0a03c;
      --high: #f2695e;
      --accent: #6aa9f0;
      --chip: #232a31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  header .spacer { flex: 1 1 auto; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  main { padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .kpi { display: flex; gap: 18px; flex-wrap: wrap; }
  .kpi div { display: flex; flex-direction: column; }
  .kpi b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .chip.ok { color: var(--ok); }
  .chip.warn { color: var(--warn); }
  .chip.high { color: var(--high); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  /* every column is as wide as its content; the spacer takes the slack, so the
     numbers stay next to each other and the actions stay on the right */
  th, td { width: 1%; }
  th.grow, td.grow { width: auto; }
  .ip { color: steelblue; }
  thead th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tbody tr:hover { background: var(--chip); }
  .lv-ok { color: var(--ok); font-weight: 600; }
  .lv-warn { color: var(--warn); font-weight: 600; }
  .lv-high { color: var(--high); font-weight: 600; }
  .dash { color: var(--muted); }
  input[type=number], input[type=text] {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 7px; width: 84px; font: inherit;
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--high); border: 1px solid var(--line); padding: 3px 9px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: default; }
  .toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; background: var(--card);
           border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px;
           padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: none; }
  .toast.err { border-left-color: var(--high); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .scroll { overflow-x: auto; }
  /* a rule between every column, a stronger one where a group starts */
  th, td { border-left: 1px solid var(--line); }
  th:first-child, td:first-child { border-left: 0; }
  th.grp, td.grp { border-left: 2px solid var(--line); }
  /* the upper card is two panes: scale-up/down on the left, scale-in/out on
     the right, each with its own contour */
  .split { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  .pane { flex: 1 1 340px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .pane-title { margin-bottom: 10px; font-size: 11px; text-transform: uppercase;
                letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  /* the flavour, one value per line so it reads as a spec sheet */
  .flavor { display: flex; flex-direction: column; gap: 2px; min-width: 220px;
            border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
            background: var(--bg); }
  .flavor .fl { display: flex; gap: 10px; font-size: 13px; }
  .flavor .fl span { color: var(--muted); min-width: 68px; }
  .flavor .fl b { font-weight: 600; font-variant-numeric: tabular-nums; }
  /* the pool is not being reconciled: impossible to miss */
  .banner { margin-top: 12px; display: none; border: 1px solid var(--warn);
            border-left: 4px solid var(--warn); border-radius: 8px;
            padding: 10px 12px; background: rgba(179, 92, 0, .10); }
  .banner strong { display: block; margin-bottom: 3px; color: var(--warn); }
  .banner code { font-size: 12px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<header>
  <h1>nodescale-ui</h1>
  <select id="poolPick" class="muted" style="background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit"></select>
  <span class="spacer"></span>
  <span class="chip" id="whoami" title="signed-in account"></span>
  <button class="ghost" id="signOut" title="sign out" style="display:none">sign out</button>
  <span class="small muted" id="stamp">loading…</span>
</header>

<main>
  <section class="card" id="summary">
    <div class="split">
      <div class="pane">
        <div class="pane-title">flavor &middot; scale-up / down</div>
        <div class="flavor">
          <div class="fl"><span>vCPU</span><b id="kCpus">&ndash;</b></div>
          <div class="fl"><span>RAM</span><b id="kMem">&ndash;</b></div>
          <div class="fl"><span>OS Disk</span><b id="kDisk">&ndash;</b></div>
          <div class="fl"><span>Template</span><b id="kTemplate">&ndash;</b></div>
        </div>
        <div class="row" id="flavorActions" style="margin-top:10px">
          <input type="number" id="fCpus" min="1" step="1" placeholder="cpus" title="vCPU">
          <input type="number" id="fMem" min="512" step="512" placeholder="memory MB" title="RAM, MB">
          <input type="number" id="fDisk" min="0" step="1" placeholder="os disk GB" title="OS disk, GB">
          <button id="setFlavor" title="send this flavor to the controller">apply flavor</button>
        </div>
        <div class="small muted" id="flavorHint" style="margin-top:6px"></div>
      </div>
      <div class="pane">
        <div class="pane-title">replicas &middot; scale-in / out</div>
        <div class="kpi">
          <div><span class="small muted" title="spec.replicas: what you asked for">desired</span><b id="kReplicas">&ndash;</b></div>
          <div><span class="small muted" title="status.observedReplicas: what the controller sees in vCD">in vCD</span><b id="kObserved">&ndash;</b></div>
          <div><span class="small muted" title="status.readyReplicas: how many of them are Ready">ready</span><b id="kReady">&ndash;</b></div>
          <div><span class="small muted" title="status.rollout.phase">rollout</span><b id="kPhase">&ndash;</b></div>
        </div>
        <div class="row" id="scaleActions" style="margin-top:10px">
          <button class="ghost" id="minus" title="one fewer worker: changes the number only">&minus;1</button>
          <button class="ghost" id="plus" title="one more worker: changes the number only">+1</button>
          <input type="number" id="replicasInput" min="0" step="1" title="desired workers">
          <button id="setReplicas" title="send this number to the controller">set replicas</button>
        </div>
        <div class="small muted" id="replicasHint" style="margin-top:6px"></div>
      </div>
    </div>
    <div class="banner" id="warning" role="alert">
      <strong>the pool is not being reconciled</strong>
      <code id="warningText"></code>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <strong style="font-size:13px">workers</strong>
      <div class="legend">
        <span><span class="dot" style="background:var(--ok)"></span>&lt; 80%</span>
        <span><span class="dot" style="background:var(--warn)"></span>80–90%</span>
        <span><span class="dot" style="background:var(--high)"></span>≥ 90%</span>
        <span>requests · limits · real, each on its own</span>
      </div>
    </div>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th rowspan="2">node</th>
            <th rowspan="2" class="grp">phase</th>
            <th colspan="3" class="grp" style="text-align:center">CPU</th>
            <th colspan="3" class="grp" style="text-align:center">memory</th>
            <th rowspan="2" class="grow"></th>
            <th rowspan="2"></th>
          </tr>
          <tr>
            <th class="grp">req</th><th>lim</th><th>real</th>
            <th class="grp">req</th><th>lim</th><th>real</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="10" class="muted small">loading…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="small muted" id="realSource" style="margin-top:8px"></div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script>
(function () {
  "use strict";
  var BASE = "__PREFIX__";
  var state = { pools: [], current: null, stamp: "", stale: false, me: null, draft: null, flavorDraft: null };
  var pick = document.getElementById("poolPick");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toast(msg, isErr) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast" + (isErr ? " err" : "");
    t.style.display = "block";
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.style.display = "none"; }, isErr ? 9000 : 4000);
  }

  function pct(share, used, unit) {
    if (!share || share.percent == null) {
      return '<span class="dash">–</span>';
    }
    var v = share.percent;
    var cls = share.level === "high" ? "lv-high" : share.level === "warn" ? "lv-warn" : "lv-ok";
    var title = used != null ? " title=\"" + used + " " + unit + "\"" : "";
    return '<span class="' + cls + '"' + title + ">" + v.toFixed(0) + "%</span>";
  }

  function cpuCell(u) { return pct(u && u.cpu, u && u.millicores, "m"); }
  function memCell(u) { return pct(u && u.memory, u && u.memoryMB, "MB"); }

  function api(path, opts) {
    return fetch(BASE + path, opts).then(function (r) {
      if (r.status === 401) {
        // The session expired or the account changed: the form is the answer.
        location.href = BASE + "/login?next=" +
          encodeURIComponent(location.pathname + location.search);
        return new Promise(function () {});
      }
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) {
          throw new Error((body && body.error) || ("HTTP " + r.status));
        }
        return body;
      });
    });
  }

  function post(action, body) {
    var p = state.current;
    return api("/api/pools/" + encodeURIComponent(p.namespace) + "/" + encodeURIComponent(p.name) + "/" + action, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Requested-With": "nodescale-ui" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      toast("accepted: " + action);
      return refresh();
    }).catch(function (e) { toast(e.message, true); });
  }

  function loadMe() {
    return api("/api/me").then(function (me) {
      state.me = me;
      var chip = document.getElementById("whoami");
      chip.textContent = me.auth ? me.username + " · " + me.role : "no auth";
      chip.className = "chip " + (me.role === "admin" ? "ok" : "warn");
      document.getElementById("signOut").style.display = me.auth ? "" : "none";
    }).catch(function () {
      state.me = null;
    });
  }

  function refresh() {
    loadMe();
    return api("/api/pools").then(function (data) {
      state.pools = data.pools || [];
      state.stamp = data.collectedAt || "";
      state.stale = !!data.stale;
      if (!state.current || !findPool(state.current.namespace, state.current.name)) {
        state.current = state.pools.length ? state.pools[0] : null;
      } else {
        state.current = findPool(state.current.namespace, state.current.name);
      }
      renderPools();
      render();
    }).catch(function (e) {
      document.getElementById("stamp").textContent = "unavailable: " + e.message;
    });
  }

  function findPool(ns, name) {
    for (var i = 0; i < state.pools.length; i++) {
      if (state.pools[i].namespace === ns && state.pools[i].name === name) { return state.pools[i]; }
    }
    return null;
  }

  function renderPools() {
    pick.innerHTML = state.pools.map(function (p) {
      return '<option value="' + esc(p.namespace + "/" + p.name) + '">' + esc(p.namespace + "/" + p.name) + "</option>";
    }).join("");
    if (state.current) {
      pick.value = state.current.namespace + "/" + state.current.name;
    }
    pick.style.display = state.pools.length > 1 ? "" : "none";
  }

  function render() {
    var p = state.current;
    var stamp = document.getElementById("stamp");
    if (!p) {
      stamp.textContent = "no K8sWorkerPool in this cluster";
      document.getElementById("rows").innerHTML = '<tr><td colspan="10" class="muted small">nothing to show</td></tr>';
      return;
    }
    stamp.textContent = (state.stale ? "stale · " : "") + (state.stamp ? new Date(state.stamp).toLocaleTimeString() : "");

    document.getElementById("kReplicas").textContent = p.replicas;
    document.getElementById("kObserved").textContent = p.observedReplicas;
    document.getElementById("kReady").textContent = p.readyReplicas;
    document.getElementById("kPhase").textContent = p.phase || "Idle";
    document.getElementById("kCpus").textContent = p.flavor.cpus;
    document.getElementById("kMem").textContent = p.flavor.memoryMB + " MB";
    document.getElementById("kDisk").textContent = p.flavor.osDiskGB ? p.flavor.osDiskGB + " GB" : "–";
    document.getElementById("kTemplate").textContent = p.flavor.template || "–";

    var warn = document.getElementById("warning");
    document.getElementById("warningText").textContent = p.warning || "";
    warn.style.display = p.warning ? "" : "none";

    if (state.draft === null) {
      document.getElementById("replicasInput").value = p.replicas;
    }
    renderDraftHint();
    if (state.flavorDraft === null) {
      document.getElementById("fCpus").value = p.flavor.cpus;
      document.getElementById("fMem").value = p.flavor.memoryMB;
      document.getElementById("fDisk").value = p.flavor.osDiskGB || "";
    }
    renderFlavorDraft();

    var admin = !state.me || state.me.role === "admin";
    document.getElementById("scaleActions").style.display = admin ? "" : "none";
    document.getElementById("flavorActions").style.display = admin ? "" : "none";

    var rows = p.nodes.map(function (n) {
      var act = n.deleting
        ? '<span class="small muted">removing…</span>'
        : admin
          ? '<button class="danger" data-del="' + esc(n.name) + '">delete</button>'
          : '<span class="small muted">view only</span>';
      return "<tr>" +
        "<td>" + esc(n.name) + (n.ip ? ' <span class="small ip">' + esc(n.ip) + "</span>" : "") + "</td>" +
        '<td class="grp"><span class="chip' + (n.phase === "Ready" ? " ok" : "") + '">' + esc(n.phase) + "</span></td>" +
        '<td class="grp">' + cpuCell(n.requests) + "</td><td>" + cpuCell(n.limits) + "</td><td>" + cpuCell(n.real) + "</td>" +
        '<td class="grp">' + memCell(n.requests) + "</td><td>" + memCell(n.limits) + "</td><td>" + memCell(n.real) + "</td>" +
        '<td class="grow"></td>' +
        "<td>" + act + "</td></tr>";
    }).join("");
    document.getElementById("rows").innerHTML = rows ||
      '<tr><td colspan="10" class="muted small">no workers in this pool</td></tr>';

    var sources = {};
    p.nodes.forEach(function (n) { if (n.realSource) { sources[n.realSource] = (sources[n.realSource] || 0) + 1; } });
    var parts = Object.keys(sources).map(function (k) { return sources[k] + " × " + k; });
    document.getElementById("realSource").textContent =
      parts.length ? "real utilisation from " + parts.join(", ") : "real utilisation unavailable: no node-exporter and no metrics-server answer";
  }

  // The buttons edit a draft in the field; nothing reaches the pool until the
  // operator presses set replicas, so a mis-click never rolls a VM.
  function draftValue() {
    if (state.draft !== null) { return state.draft; }
    return state.current ? state.current.replicas : 0;
  }

  function setDraft(next) {
    if (next < 0) { next = 0; }
    state.draft = next;
    document.getElementById("replicasInput").value = next;
    renderDraftHint();
  }

  function renderDraftHint() {
    var input = document.getElementById("replicasInput");
    var hint = document.getElementById("replicasHint");
    var desired = state.current ? state.current.replicas : null;
    if (state.draft !== null && state.draft !== desired) {
      hint.textContent = "draft " + state.draft + " (desired " + desired + ") - press set replicas";
      input.style.borderColor = "var(--accent)";
    } else {
      hint.textContent = "";
      input.style.borderColor = "";
    }
  }

  document.getElementById("plus").addEventListener("click", function () {
    if (state.current) { setDraft(draftValue() + 1); }
  });
  document.getElementById("minus").addEventListener("click", function () {
    if (state.current) { setDraft(draftValue() - 1); }
  });
  document.getElementById("replicasInput").addEventListener("input", function () {
    var v = parseInt(this.value, 10);
    state.draft = isNaN(v) || v < 0 ? null : v;
    renderDraftHint();
  });
  document.getElementById("setReplicas").addEventListener("click", function () {
    if (!state.current) { return; }
    var v = parseInt(document.getElementById("replicasInput").value, 10);
    if (isNaN(v) || v < 0) { toast("replicas must be a number >= 0", true); return; }
    if (v < state.current.minReplicas) {
      toast("the pool floor is minReplicas: " + state.current.minReplicas, true);
      return;
    }
    if (v === 0 && !state.current.allowLastWorker) {
      toast("scale-in to 0 needs scaleDown.allowLastWorker: true on the pool", true);
      return;
    }
    state.draft = null;
    post("replicas", { replicas: v });
  });
  // Same rule as the replicas buttons: the fields are a draft, and only
  // apply flavor sends them to the pool.
  function readFlavor() {
    return {
      cpus: parseInt(document.getElementById("fCpus").value, 10),
      memoryMB: parseInt(document.getElementById("fMem").value, 10),
      osDiskGB: parseInt(document.getElementById("fDisk").value, 10)
    };
  }

  function renderFlavorDraft() {
    var p = state.current;
    var hint = document.getElementById("flavorHint");
    var floor = p ? "minReplicas " + p.minReplicas + (p.allowLastWorker ? " · last worker allowed" : "") : "";
    var d = state.flavorDraft;
    if (!d || !p) { hint.textContent = floor; return; }
    if (d.cpus === p.flavor.cpus && d.memoryMB === p.flavor.memoryMB &&
        (d.osDiskGB || 0) === (p.flavor.osDiskGB || 0)) {
      hint.textContent = floor;
      return;
    }
    hint.textContent = "draft " + (d.cpus || "?") + " vCPU / " + (d.memoryMB || "?") + " MB / " +
      (d.osDiskGB || 0) + " GB - press apply flavor";
  }

  ["fCpus", "fMem", "fDisk"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", function () {
      state.flavorDraft = readFlavor();
      renderFlavorDraft();
    });
  });

  document.getElementById("setFlavor").addEventListener("click", function () {
    var body = readFlavor();
    if (!body.cpus || !body.memoryMB) {
      toast("vCPU and RAM are required", true);
      return;
    }
    body.osDiskGB = body.osDiskGB || 0;
    state.flavorDraft = null;
    post("flavor", body);
  });
  document.getElementById("rows").addEventListener("click", function (ev) {
    var name = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-del");
    if (!name) { return; }
    if (!window.confirm("Remove " + name + "? It is drained and deleted, and the pool loses one worker.")) { return; }
    post("delete-workers", { workers: [name] });
  });
  pick.addEventListener("change", function () {
    var parts = pick.value.split("/");
    state.current = findPool(parts[0], parts.slice(1).join("/"));
    state.draft = null;
    state.flavorDraft = null;
    render();
  });

  document.getElementById("signOut").addEventListener("click", function () {
    fetch(BASE + "/api/logout", {
      method: "POST",
      headers: { "X-Requested-With": "nodescale-ui" }
    }).then(function () { location.href = BASE + "/login"; });
  });

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
