#cloud-config
# render=0.5.0 hash=e33bfdbabffc
preserve_hostname: false
hostname: pool-wrk-01
fqdn: pool-wrk-01

users:
  - name: ubuntu
    groups: [sudo]
    shell: /bin/bash
    # cloud-init locks the account when a passwd hash is set unless this is
    # false; a locked account cannot authenticate for sudo, which the operator
    # needs on a guest that failed a stage.
    lock_passwd: false

# The Terraform baseline allows password login, and an operator locked out of a
# worker that failed a stage needs it. Key-only would be a different policy than
# the one the cluster's own images are built with.
ssh_pwauth: true

# Same apt policy as the Terraform baseline: retry a slow mirror, wait for the
# dpkg lock instead of failing, and never update or upgrade on its own.
apt:
  conf: |
    Acquire {
      Retries "60"
    }
    DPkg {
      Lock {
        Timeout "60"
      }
    }

package_update: false
package_upgrade: false

# Declarative only: two boot steps, everything else is a file or a unit. See
# customization-phases.md §4.2 - work that can fail slowly or needs a retry
# belongs in a systemd unit, not here.
bootcmd:
  # The image ships /etc/security/access.conf ending in "-:ALL:ALL" with
  # pam_access enabled for login and sshd, so an account without an allow line
  # cannot log in at all - console included. The Terraform baseline inserts the
  # same line for the cluster account.
  - |
    grep -q '^+:ubuntu:ALL$' /etc/security/access.conf 2>/dev/null ||
      sed -i '/^-:ALL:ALL/i +:ubuntu:ALL' /etc/security/access.conf
  - |
    if [ -x /usr/local/sbin/prepare-data-disks.sh ]; then
      /usr/local/sbin/prepare-data-disks.sh || echo "prepare-data-disks.sh failed, continuing"
    fi
  - |
    systemctl daemon-reload || true
    systemctl enable --now --no-block k8s-node-prereqs.service || true

write_files:
  # Fallback network config for the case where the vCD customization phase did
  # not run; the initscript writes 01-netplan.yaml and removes this file.
  - path: /etc/netplan/50-cloud-init.yaml
    permissions: '0600'
    content: |
      network:
        version: 2
        ethernets:
          ens192:
            dhcp4: false
            addresses: [192.0.2.10/24]
            routes:
              - to: default
                via: 192.0.2.1
            nameservers:
              addresses: ["192.0.2.53"]

  # Parity with the Terraform baseline: a password login that works when a
  # worker has to be rescued by hand. 0600 because sshd refuses a group- or
  # world-writable include file. The matching apt policy is written by the
  # pre-requisites script, after the Pro packages that own 10periodic are gone.
  - path: /etc/sudoers.d/ubuntu
    permissions: '0440'
    content: |
      # Written by the node controller, mirroring the Terraform baseline so a
      # worker that failed a stage can be inspected without a password prompt.
      Defaults:ubuntu !requiretty
      ubuntu ALL=(ALL) NOPASSWD: ALL

  - path: /etc/ssh/sshd_config.d/01-k8s-auth.conf
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
      PermitRootLogin no
    permissions: '0600'
  # bootstrap.caBundleRef: one file per certificate, then one
  # update-ca-certificates run in runcmd. The Terraform baseline does the same
  # through cloud-init's ca_certs.trusted.
  - path: /usr/local/share/ca-certificates/nodescale-00.crt
    permissions: '0644'
    content: |
      -----BEGIN CERTIFICATE-----
      MIIBszCCAVmgAwIBAgIUTESTCERT
      -----END CERTIFICATE-----

  # The Terraform baseline writes every node of the cluster into /etc/hosts, so
  # a worker can resolve its peers before DNS knows them. The controller knows
  # the pool's own workers (and reads the cluster's Nodes), and appends rather
  # than replacing the file cloud-init writes for the guest's own hostname.
  - path: /etc/hosts
    append: true
    content: |
      192.0.2.2 master-01
      192.0.2.10 pool-wrk-01
      192.0.2.11 pool-wrk-02

  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
  # bootstrap.kernelModules: loaded before the sysctls below, because a
  # conntrack parameter is silently dropped when its module is not there.
  - path: /etc/modules-load.d/nodescale.conf
    content: |
      nf_conntrack

  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  # bootstrap.sysctls, last in lexical order on purpose: sysctl applies the
  # directory in name order, so 99-zzz-nodescale.conf overrides the image's
  # 99-unixteam-sysctl.conf instead of being overridden by it.
  - path: /etc/sysctl.d/99-zzz-nodescale.conf
    content: |
      net.core.rmem_max = 67108864
      net.netfilter.nf_conntrack_max = 2621440

  - path: /etc/kubernetes/join-command.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      set -euo pipefail
      kubeadm join 192.0.2.2:6443 --token x --discovery-token-ca-cert-hash sha256:y

  - path: /usr/local/sbin/vcd-verify-layout.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      # Pre-join gate (customization-phases.md, R7).
      #
      # Refuse to join when a data disk did not end up where the spec asked for. A
      # guest whose /var move failed half-way must fail here, with a readable message,
      # instead of joining and writing containerd/kubelet data to the root disk (the
      # wrk-03 class of failure).
      #
      # Called by k8s-node-join.service as ExecStartPre. Exit 0 = layout is correct.
      set -uo pipefail

      LOG=/var/log/vcd-layout.log
      exec >>"$LOG" 2>&1
      log() { echo "[$(date -Is)] $*"; }

      fail=0

      check() { # mountpoint expected_device size_gb
        local mnt="$1" want="$2" want_gb="$3" src have_gb
        if ! src=$(findmnt -n -o SOURCE --target "$mnt" 2>/dev/null) || [[ -z "$src" ]]; then
          log "FAIL $mnt is not a mount point"
          fail=1
          return
        fi
        if [[ "$(readlink -f "$src")" != "$(readlink -f "$want")" ]]; then
          log "FAIL $mnt is on $src, expected $want"
          fail=1
          return
        fi
        have_gb=$(df -BG --output=size "$mnt" 2>/dev/null | tail -1 | tr -dc '0-9')
        if [[ -z "$have_gb" ]]; then
          log "WARN could not read the size of $mnt"
        elif (( have_gb + 1 < want_gb )); then
          log "FAIL $mnt is ${have_gb}G, expected about ${want_gb}G"
          fail=1
          return
        fi
        log "ok $mnt on $src (${have_gb}G)"
      }
      check "/var" "/dev/data1_vg/data1_lv" 10
      check "/var/lib" "/dev/data2_vg/data2_lv" 30

      if (( fail != 0 )); then
        log "layout check failed; refusing to join"
        exit 1
      fi
      log "layout ok"
      exit 0

  - path: /usr/local/sbin/vcd-ensure-layout.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      # Boot-time repair (customization-phases.md, R7/R8).
      #
      # fstab is written by the customization phase, i.e. after the boot that reads
      # fstab, so the *next* boot is the one that must mount the data disks. When it
      # does not - observed on the first live run: data2_lv stayed mounted on /data2
      # while /var/lib came up empty, leaving apt without a database and cloud-init
      # without its seed - this unit mounts the configured device itself, before
      # anything that depends on it.
      #
      # Idempotent: on a healthy boot every check passes and nothing is mounted.
      set -uo pipefail

      LOG=/var/log/vcd-layout.log
      exec >>"$LOG" 2>&1
      log() { echo "[$(date -Is)] $*"; }
      log "ensure-layout starting"

      rc=0

      ensure() { # mountpoint expected_device
        local mnt="$1" want="$2" src
        src=$(findmnt -n -o SOURCE --target "$mnt" 2>/dev/null || true)
        if [[ -n "$src" && "$(readlink -f "$src")" == "$(readlink -f "$want")" ]]; then
          log "ok $mnt on $src"
          return 0
        fi
        if [[ -z "$src" ]]; then
          log "$mnt is not a mount point; mounting $want"
        else
          log "$mnt is on $src, expected $want; mounting $want over it"
        fi
        mkdir -p "$mnt" || { log "mkdir $mnt failed"; rc=1; return 1; }
        if mount "$want" "$mnt"; then
          log "mounted $want at $mnt"
        else
          log "FAILED to mount $want at $mnt"
          rc=1
        fi
      }
      ensure "/var" "/dev/data1_vg/data1_lv"
      ensure "/var/lib" "/dev/data2_vg/data2_lv"

      if (( rc != 0 )); then
        log "ensure-layout finished with errors"
        exit 1
      fi
      log "ensure-layout done"
      exit 0

  - path: /usr/local/sbin/vcd-grow-root.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      # Grow the root filesystem into the disk vCD handed us.
      #
      # A clone carries the template's partition table: on this image the disk is
      # 20 GiB but sda3 is 8.29 GiB, so / reports 7.6 GiB and ~11 GiB stay unusable.
      # The controller grows the virtual disk; until this script existed nothing in
      # the guest grew the partition, the PV, the LV or the filesystem.
      #
      # Idempotent: on a disk that is already grown every step is a no-op. It only
      # ever touches the volume group the root filesystem lives in - the data VGs
      # own their own disks and are prepared by prepare-data-disks.sh.
      set -uo pipefail

      LOG=/var/log/vcd-grow-root.log
      exec >>"$LOG" 2>&1
      log() { echo "[$(date -Is)] $*"; }

      root_src=$(findmnt -n -o SOURCE / 2>/dev/null || true)
      if [[ -z "$root_src" ]]; then
        log "cannot resolve the device behind /"
        exit 1
      fi
      log "root is $root_src"

      pv=""
      vg=""
      lv=""
      lvpath=""

      case "$root_src" in
        /dev/mapper/*|/dev/*-*/*)
          if ! command -v lvs >/dev/null 2>&1; then
            log "no LVM tools on this image; nothing to grow"
            exit 0
          fi
          vg=$(lvs --noheadings -o vg_name "$root_src" 2>/dev/null | tr -d ' ')
          lv=$(lvs --noheadings -o lv_name "$root_src" 2>/dev/null | tr -d ' ')
          lvpath=$(readlink -f "$root_src")
          if [[ -z "$vg" || -z "$lv" ]]; then
            log "root is $root_src but no LV matches it"
            exit 1
          fi
          pv=$(pvs --noheadings -o pv_name --select "vg_name=$vg" 2>/dev/null | tr -d ' ' | head -n1)
          # The VG/LV pair, not the resolved device: readlink turns the mapper path
          # into /dev/dm-0 and lvextend does not accept that form.
          if [[ -z "$pv" ]]; then
            log "no physical volume backs VG $vg"
            exit 1
          fi
          ;;
        /dev/*)
          lvpath="$root_src"
          ;;
        *)
          log "root is $root_src (overlay or network); nothing to grow"
          exit 0
          ;;
      esac

      grow_partition() {
        local dev="$1" disk part out rc
        disk=$(lsblk -no pkname "$dev" 2>/dev/null | head -n1)
        part=$(cat "/sys/class/block/$(basename "$dev")/partition" 2>/dev/null || true)
        if [[ -z "$disk" || -z "$part" ]]; then
          log "$dev is not a partition; skipping the partition step"
          return 0
        fi
        if command -v growpart >/dev/null 2>&1; then
          out=$(growpart "/dev/$disk" "$part" 2>&1)
          rc=$?
          log "growpart /dev/$disk $part -> rc=$rc ${out:-}"
        elif command -v parted >/dev/null 2>&1; then
          out=$(parted ---pretend-input-tty "/dev/$disk" resizepart "$part" 100% 2>&1)
          rc=$?
          log "parted resizepart /dev/$disk $part -> rc=$rc ${out:-}"
        else
          log "neither growpart nor parted is installed; cannot grow the partition"
          return 1
        fi
        partprobe "/dev/$disk" >/dev/null 2>&1 || true
        udevadm settle >/dev/null 2>&1 || true
        return 0
      }

      if [[ -n "$pv" ]]; then
        grow_partition "$pv" || true
        # The partition table change reaches the kernel a moment after growpart
        # returns, and pvresize/lvextend read it back through the kernel. Give it that
        # moment, log what the tools say, and retry once: the first live worker showed
        # pvresize seeing the new size while lvextend failed, with its stderr thrown
        # away, leaving 11 GiB unclaimed.
        udevadm settle >/dev/null 2>&1 || true
        out=$(pvresize "$pv" 2>&1)
        log "pvresize $pv -> ${out:-ok}"
        free=$(vgs --noheadings -o vg_free_count "$vg" 2>/dev/null | tr -d ' ')
        if [[ "${free:-0}" -gt 0 ]]; then
          log "extending $vg/$lv by $free extents"
          out=$(lvextend -y -l +100%FREE "$vg/$lv" 2>&1)
          rc=$?
          if [[ "$rc" -ne 0 ]]; then
            log "lvextend failed (rc=$rc): $out; retrying"
            sleep 3
            udevadm settle >/dev/null 2>&1 || true
            out=$(lvextend -y -l +100%FREE "$vg/$lv" 2>&1) || log "lvextend failed again: $out"
          else
            log "lvextend: $out"
          fi
        else
          log "$vg has no free extents; the LV already fills it"
        fi
      else
        grow_partition "$lvpath" || true
      fi

      fstype=$(blkid -s TYPE -o value "$lvpath" 2>/dev/null || true)
      case "$fstype" in
        ext2|ext3|ext4)
          out=$(resize2fs "$lvpath" 2>&1) || log "resize2fs $lvpath failed: $out"
          ;;
        xfs)
          xfs_growfs / >/dev/null 2>&1 || log "xfs_growfs / failed"
          ;;
        "")
          log "no filesystem type found on $lvpath; nothing to resize"
          ;;
        *)
          log "filesystem $fstype is not grown automatically"
          ;;
      esac

      log "done: $(df -h / | tail -n1)"
      exit 0

  # The same Option A script the vCD initscript runs in postCustomization:
  # LVM on the data disks, copy /var and /var/lib into the new volumes, fstab by
  # UUID. vCD reboots the guest after customization; here the guest does it once
  # from runcmd below, because moving /var only takes effect on the next boot.
  - path: /usr/local/sbin/prepare-data-disks.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      # Option A data-disk preparation, mirroring the Ansible prepare_k8s_nodes role:
      #   LVM on the data disks -> temporary mounts -> move /var and /var/lib ->
      #   rewrite fstab by UUID -> the guest is rebooted by vCD afterwards.
      #
      # The script never reboots: it runs during the vCD post-customization phase and
      # vCD power-cycles the guest once the phase returns. A marker on the root
      # filesystem keeps it idempotent, and LVM/filesystem creation is skipped when
      # it already exists.
      set -euo pipefail

      MARKER=/etc/vcd-data-disks.done
      LOG=/root/vcd-data-disks.log
      exec >>"$LOG" 2>&1

      log() {
        echo "[$(date -Is)] $*"
      }

      if [[ -f "$MARKER" ]]; then
        log "data disks already prepared; nothing to do"
        exit 0
      fi

      for tool in pvcreate vgcreate lvcreate pvs vgs lvs mkfs blkid rsync blockdev mountpoint; do
        if ! command -v "$tool" >/dev/null 2>&1; then
          log "missing required tool: $tool"
          exit 1
        fi
      done

      wait_for_device() {
        local dev="$1" size_gb="$2" i bytes expected
        expected=$((size_gb * 1024 * 1024 * 1024))
        for i in $(seq 1 60); do
          if [[ -b "$dev" ]]; then
            bytes=$(blockdev --getsize64 "$dev")
            # Allow 1 GiB tolerance for controller/geometry rounding.
            if (( bytes >= expected - 1073741824 && bytes <= expected + 1073741824 )); then
              return 0
            fi
            log "device $dev has unexpected size $bytes (expected about $expected)"
            return 1
          fi
          sleep 2
        done
        log "timed out waiting for $dev"
        return 1
      }

      prepare_disk() {
        local dev="$1" vg="$2" lv="$3" temp="$4" fs="$5" size_gb="$6"
        local lvdev existing_fs

        wait_for_device "$dev" "$size_gb"

        if pvs --noheadings -o pv_name "$dev" 2>/dev/null | grep -qw "$dev"; then
          log "$dev is already an LVM physical volume"
        else
          # Never overwrite a disk that already carries a filesystem or partition
          # table. A blank data disk has no signature.
          if blkid -p "$dev" >/dev/null 2>&1; then
            log "$dev already has a filesystem/partition signature; refusing to overwrite"
            return 1
          fi
          log "creating physical volume on $dev"
          pvcreate -ff -y "$dev"
        fi

        if ! vgs "$vg" >/dev/null 2>&1; then
          log "creating volume group $vg"
          vgcreate "$vg" "$dev"
        fi

        if ! lvs "$vg/$lv" >/dev/null 2>&1; then
          log "creating logical volume $vg/$lv"
          lvcreate -l 100%FREE -n "$lv" "$vg"
        fi

        lvdev=$(readlink -f "/dev/${vg}/${lv}")
        existing_fs=$(blkid -p -s TYPE -o value "$lvdev" 2>/dev/null || true)
        if [[ -n "$existing_fs" && "$existing_fs" != "$fs" ]]; then
          log "$lvdev already contains filesystem $existing_fs, expected $fs; refusing to format"
          return 1
        fi
        if [[ -z "$existing_fs" ]]; then
          log "formatting $lvdev as $fs"
          mkfs -t "$fs" "$lvdev"
        fi

        mkdir -p "$temp"
        if ! mountpoint -q "$temp"; then
          log "mounting $lvdev at $temp"
          mount "$lvdev" "$temp"
        fi
      }

      sync_data() {
        local src="$1" dst="$2"
        shift 2
        local excludes=() e

        if [[ ! -d "$src" ]]; then
          log "source $src does not exist; skipping copy"
          return 0
        fi
        # Skip only when the target volume already carries the data. The source being
        # a mount point is not enough: on a controller-made worker /var or /var/lib
        # can be mounted when this runs, and skipping there left the new volume empty
        # (no /var/lib/dpkg, apt then failed with "Unable to acquire the dpkg frontend
        # lock").
        if [[ -n "$(ls -A "$dst" 2>/dev/null | grep -v '^lost+found$')" ]]; then
          log "$dst already contains data; skipping copy of $src"
          return 0
        fi
        if [[ -z "$(ls -A "$src" 2>/dev/null)" ]]; then
          log "source $src is empty; skipping copy"
          return 0
        fi

        for e in "$@"; do
          excludes+=("--exclude=$e")
        done
        log "copying $src -> $dst (excludes: ${*:-none})"
        rsync -aHAX --one-file-system "${excludes[@]}" "$src"/ "$dst"/

        # Keep excluded child mount points present under the parent so the later
        # nested mount (e.g. /var/lib on data2) has a directory to mount over.
        for e in "$@"; do
          mkdir -p "$dst$e"
        done
      }

      write_fstab() {
        local final="$1" temp="$2" vg="$3" lv="$4" fs="$5"
        local lvdev uuid

        lvdev=$(readlink -f "/dev/${vg}/${lv}")
        uuid=$(blkid -s UUID -o value "$lvdev")
        if [[ -z "$uuid" ]]; then
          log "no UUID found on $lvdev"
          return 1
        fi

        # Remove stale entries for the temporary and final mount points, but keep
        # comments. The trailing whitespace in the pattern prevents /var from
        # matching /var/lib.
        sed -i "\#^[^#].*[[:space:]]${temp}[[:space:]]#d" /etc/fstab
        sed -i "\#^[^#].*[[:space:]]${final}[[:space:]]#d" /etc/fstab
        echo "UUID=$uuid $final $fs defaults 0 2" >>/etc/fstab
        log "fstab entry: UUID=$uuid $final $fs"
      }
      prepare_disk "/dev/sdb" "data1_vg" "data1_lv" "/data1" "ext4" 10
      sync_data "/var" "/data1" "/lib"
      write_fstab "/var" "/data1" "data1_vg" "data1_lv" "ext4"
      prepare_disk "/dev/sdc" "data2_vg" "data2_lv" "/data2" "ext4" 30
      sync_data "/var/lib" "/data2"
      write_fstab "/var/lib" "/data2" "data2_vg" "data2_lv" "ext4"

      touch "$MARKER"
      sync
      log "data disks prepared; vCD reboots the guest after post-customization so the new mounts take effect"
      exit 0

  - path: /usr/local/sbin/vcd-grow-data-disks.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      # Grow the data disks into the space vCD added.
      #
      # prepare-data-disks.sh gives each data disk one volume group with a logical
      # volume filling it, so growing a disk is pvresize -> lvextend -> grow the
      # filesystem. Idempotent: on a disk that already fills its VG every step is a
      # no-op, and nothing here can shrink anything. It only touches the volume groups
      # the spec names, never the root VG and never a data VG that is absent (a worker
      # created before the disks existed simply has nothing to do).
      set -uo pipefail

      LOG=/var/log/vcd-grow-data.log
      exec >>"$LOG" 2>&1
      log() { echo "[$(date -Is)] $*"; }
      log "growing data disks"

      grow() { # vg lv mount fstype
        local vg="$1" lv="$2" mnt="$3" fs="$4" pv free out
        if ! vgs "$vg" >/dev/null 2>&1; then
          log "volume group $vg does not exist; nothing to grow for $mnt"
          return 0
        fi
        pv=$(pvs --noheadings -o pv_name --select "vg_name=$vg" 2>/dev/null | tr -d ' ' | head -n1)
        if [[ -n "$pv" ]]; then
          udevadm settle >/dev/null 2>&1 || true
          out=$(pvresize "$pv" 2>&1)
          log "pvresize $pv -> ${out:-ok}"
        fi
        free=$(vgs --noheadings -o vg_free_count "$vg" 2>/dev/null | tr -d ' ')
        if [[ "${free:-0}" -gt 0 ]]; then
          out=$(lvextend -y -l +100%FREE "$vg/$lv" 2>&1)
          if [[ $? -ne 0 ]]; then
            sleep 3
            udevadm settle >/dev/null 2>&1 || true
            out=$(lvextend -y -l +100%FREE "$vg/$lv" 2>&1) || { log "lvextend $vg/$lv failed: $out"; return 1; }
          fi
          log "lvextend $vg/$lv: $out"
        fi
        case "$fs" in
          ext2|ext3|ext4)
            out=$(resize2fs "/dev/$vg/$lv" 2>&1) || { log "resize2fs /dev/$vg/$lv failed: $out"; return 1; }
            ;;
          xfs)
            out=$(xfs_growfs "$mnt" 2>&1) || { log "xfs_growfs $mnt failed: $out"; return 1; }
            ;;
          *)
            log "filesystem $fs on $mnt is not grown automatically"
            return 0
            ;;
        esac
        log "grew $mnt: $(df -h "$mnt" | tail -n1)"
        return 0
      }
      grow "data1_vg" "data1_lv" "/var" "ext4" || log "grow of /var failed; continuing"
      grow "data2_vg" "data2_lv" "/var/lib" "ext4" || log "grow of /var/lib failed; continuing"

      log "done"
      exit 0

  - path: /usr/local/sbin/k8s-node-prereqs.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      # Stage: OS prerequisites. Slow, network-dependent, retried by systemd.
      # Marker keeps it idempotent; it never touches the cluster.
      set -euo pipefail

      LOG=/var/log/k8s-node-prereqs.log
      exec >>"$LOG" 2>&1
      log() { echo "[$(date -Is)] $*"; }
      log "starting prerequisites render=0.5.0 hash=e33bfdbabffc"

      # 0. The virtual disk may be bigger than the template's partition table:
      #    a 20 GiB clone of an 8 GiB image leaves / at 7.6 GiB and the apt
      #    below fills it. Grow the root before anything needs the space. It is
      #    idempotent and deliberately outside the marker: a disk extended
      #    later (spec.flavor.osDiskGB) is picked up on the next boot.
      # The growth itself is vcd-grow-disks.service, ordered before this unit:
      # it must also run on every later boot, and this stage runs once.
      if [[ ! -f /etc/kubernetes/grow-disks.done ]]; then
        systemctl start vcd-grow-disks.service || log "growing the filesystems failed; continuing"
        touch /etc/kubernetes/grow-disks.done
      fi

      MARKER=/etc/kubernetes/prereqs.done
      if [[ -f "$MARKER" ]]; then
        log "prerequisites already done"
        exit 0
      fi

      # 0b. Parity with the Terraform baseline: unattended-upgrades must not
      #     compete for the dpkg lock while the node is being prepared, and
      #     Pro/ESM hooks must not inject repositories the cluster image never
      #     had. Done before any apt call, once.
      systemctl disable --now unattended-upgrades >/dev/null 2>&1 || true
      DEBIAN_FRONTEND=noninteractive apt-get purge --auto-remove -y \
        unattended-upgrades ubuntu-advantage-tools ubuntu-pro-client >/dev/null 2>&1 || true
      rm -f /etc/apt/apt.conf.d/20apt-esm-hook.conf
      sed -i 's/^Prompt.*/Prompt=never/' /etc/update-manager/release-upgrades 2>/dev/null || true
      truncate -s 0 /var/lib/ubuntu-release-upgrader/release-upgrade-available 2>/dev/null || true
      # Written here and not by cloud-init: on this image 10periodic is a
      # conffile of ubuntu-advantage-tools, so the purge above deletes it.
      cat >/etc/apt/apt.conf.d/10periodic <<'APTCONF'
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Download-Upgradeable-Packages "0";
      APT::Periodic::AutocleanInterval "0";
      APT::Periodic::Unattended-Upgrade "0";
      APTCONF
      log "unattended upgrades and Pro hooks removed, periodic apt disabled"

      K8S_MINOR="v1.35"
      K8S_VERSION="1.35.9-1.1"
      if [[ -z "$K8S_MINOR" ]]; then
        log "bootstrap.k8sMinorRepo is empty; cannot configure the Kubernetes apt repository"
        exit 1
      fi

      # 1. kubelet requires swap to be disabled.
      swapoff -a || true
      sed -ri 's@^([^#].*[[:space:]]swap[[:space:]].*)@#\1@' /etc/fstab

      # 2. Kernel modules and sysctls (config files are written above).
      modprobe overlay
      modprobe br_netfilter
      modprobe nf_conntrack || log "modprobe nf_conntrack failed; continuing"
      sysctl --system

      # 3. containerd.
      if ! command -v containerd >/dev/null 2>&1; then
        apt-get update -y
        DEBIAN_FRONTEND=noninteractive apt-get install -y containerd conntrack socat cloud-guest-utils
      fi
      mkdir -p /etc/containerd
      # A generic image ships no containerd config at all (the package does not
      # own the path) and the built-in defaults use SystemdCgroup=false, which
      # the systemd cgroup driver kubelet runs cannot work with. Generate the
      # base from the installed binary so it matches the version, then write
      # this installation's values into a drop-in.
      if [[ ! -f /etc/containerd/config.toml ]]; then
        containerd config default > /etc/containerd/config.toml
        log "generated /etc/containerd/config.toml from containerd config default"
      fi
      mkdir -p /etc/containerd/conf.d
      if ! grep -q '/etc/containerd/conf.d/\*.toml' /etc/containerd/config.toml; then
        if grep -q '^imports' /etc/containerd/config.toml; then
          sed -i 's|^imports = .*|imports = ["/etc/containerd/conf.d/*.toml"]|' /etc/containerd/config.toml
        else
          sed -i '1i imports = ["/etc/containerd/conf.d/*.toml"]' /etc/containerd/config.toml
        fi
        log "enabled /etc/containerd/conf.d imports"
      fi
      # containerd 2.x renamed the CRI plugin: the runtime section is
      # io.containerd.cri.v1.runtime and images (sandbox, registry) are
      # io.containerd.cri.v1.images, while 1.x keeps both under
      # io.containerd.grpc.v1.cri (a base file declaring version = 2, which
      # containerd 2.x still accepts through its legacy mapping). A key in the
      # wrong layout is ignored with a warning and SystemdCgroup silently stays
      # false, so the layout is read from the base file, not assumed from the
      # binary version.
      runtime_plugin=io.containerd.grpc.v1.cri
      images_plugin=io.containerd.grpc.v1.cri
      sandbox_section="[plugins.\"io.containerd.grpc.v1.cri\"]"
      sandbox_key=sandbox_image
      if grep -qE '^[[:space:]]*version[[:space:]]*=[[:space:]]*3' /etc/containerd/config.toml ||
        grep -q 'io.containerd.cri.v1.images' /etc/containerd/config.toml; then
        runtime_plugin=io.containerd.cri.v1.runtime
        images_plugin=io.containerd.cri.v1.images
        sandbox_section="[plugins.\"io.containerd.cri.v1.images\".pinned_images]"
        sandbox_key=sandbox
      fi
      {
        echo "[plugins.\"${runtime_plugin}\".containerd.runtimes.runc.options]"
        echo '  SystemdCgroup = true'
        echo "${sandbox_section}"
        echo "  ${sandbox_key} = \"registry.example.com/pause:3.9\""
        if [[ "$images_plugin" != "io.containerd.cri.v1.images" ]]; then
          echo "[plugins.\"${images_plugin}\".registry.mirrors.\"docker.io\"]"
          echo '  endpoint = ["http://mirror.example.com"]'
        fi
      } > /etc/containerd/conf.d/10-nodescale.toml
      log "wrote the containerd drop-in for ${runtime_plugin}"
      systemctl enable containerd
      systemctl restart containerd
      if command -v containerd >/dev/null 2>&1; then
        if ! containerd config dump 2>/dev/null | grep -q 'SystemdCgroup = true'; then
          log "WARNING: SystemdCgroup is not true in the effective containerd config"
          log "WARNING: if this containerd is 2.x, its CRI keys are io.containerd.cri.v1.*; set bootstrap.containerd.configRef"
        fi
      fi

      # 4. Kubernetes binaries, pinned when a version is configured.
      if ! command -v kubeadm >/dev/null 2>&1; then
        apt-get update -y
        DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gpg apt-transport-https
        install -d -m 0755 /etc/apt/keyrings
        curl -fsSL "https://pkgs.k8s.io/core:/stable:/${K8S_MINOR}/deb/Release.key" \
          | gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/${K8S_MINOR}/deb/ /" \
          > /etc/apt/sources.list.d/kubernetes.list
        apt-get update -y
        if [[ -n "$K8S_VERSION" ]]; then
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            "kubelet=${K8S_VERSION}" "kubeadm=${K8S_VERSION}" "kubectl=${K8S_VERSION}"
        else
          DEBIAN_FRONTEND=noninteractive apt-get install -y kubelet kubeadm kubectl
        fi
        apt-mark hold kubelet kubeadm kubectl
      fi
      systemctl enable kubelet

      touch "$MARKER"
      log "prerequisites done"

  - path: /usr/local/sbin/k8s-node-join.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      # Stage: join the cluster. The only step that changes cluster state, so it
      # waits for the prerequisites and for the API instead of failing fast.
      set -euo pipefail

      LOG=/var/log/k8s-node-join.log
      exec >>"$LOG" 2>&1
      log() { echo "[$(date -Is)] $*"; }
      log "starting join render=0.5.0 hash=e33bfdbabffc"

      MARKER=/etc/kubernetes/kubeadm-joined
      if [[ -f "$MARKER" ]]; then
        log "already joined"
        exit 0
      fi
      # kubeadm writes kubelet.conf on success; the marker is the authority.
      if [[ -f /etc/kubernetes/kubelet.conf ]]; then
        log "kubelet.conf exists; recording the marker"
        touch "$MARKER"
        exit 0
      fi

      ENDPOINT="192.0.2.2:6443"

      # Wait for the prerequisites (they retry independently in their own unit).
      for _ in $(seq 1 30); do
        [[ -f /etc/kubernetes/prereqs.done ]] && break
        sleep 10
      done
      if [[ ! -f /etc/kubernetes/prereqs.done ]]; then
        log "prerequisites are not finished yet"
        exit 1
      fi

      # Wait for the API server instead of burning an attempt on a cold route.
      if [[ -n "$ENDPOINT" ]]; then
        api=0
        for _ in $(seq 1 24); do
          if curl -skf --max-time 5 "https://$ENDPOINT/healthz" >/dev/null 2>&1; then
            api=1
            break
          fi
          sleep 5
        done
        if [[ "$api" -ne 1 ]]; then
          log "API $ENDPOINT is not reachable"
          exit 1
        fi
        log "API $ENDPOINT reachable"
      fi

      # kubeadm has no timeout of its own: when discovery cannot be verified
      # (observed: a token whose cluster-info JWS entry was missing) it prints
      # "...pre-flight checks" and waits forever. Bound it so the unit fails,
      # retries and reports instead of sitting in "activating" for hours.
      log "running kubeadm join (15m timeout)"
      if ! timeout 900 bash /etc/kubernetes/join-command.sh; then
        log "kubeadm join failed or timed out"
        exit 1
      fi
      touch "$MARKER"
      log "join finished"

  # Runs on every boot, before anything needs the space: a disk grown by a
  # later resize is only useful once the guest has grown into it. Both scripts
  # are idempotent, so a boot that changes nothing costs a few milliseconds.
  - path: /etc/systemd/system/vcd-grow-disks.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Grow the root and data filesystems into the space vCD gave us
      After=local-fs.target vcd-ensure-layout.service
      Before=k8s-node-prereqs.service k8s-node-join.service
      StartLimitIntervalSec=0

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/vcd-grow-root.sh
      ExecStart=/usr/local/sbin/vcd-grow-data-disks.sh
      RemainAfterExit=yes
      TimeoutStartSec=10min

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/vcd-ensure-layout.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Mount the data disks where the spec says
      After=local-fs.target
      Before=k8s-node-prereqs.service k8s-node-join.service
      ConditionPathExists=/etc/vcd-data-disks.done
      StartLimitIntervalSec=0

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/vcd-ensure-layout.sh
      RemainAfterExit=yes
      Restart=on-failure
      RestartSec=15

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/k8s-node-prereqs.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Prepare the worker OS (packages, containerd, sysctl)
      Wants=network-online.target vcd-ensure-layout.service
      After=network-online.target vcd-ensure-layout.service
      ConditionPathExists=!/etc/kubernetes/prereqs.done
      StartLimitIntervalSec=0

      [Service]
      Type=oneshot
      # apt and dpkg live on /var/lib: refuse to run on an empty layout instead
      # of failing with "Could not open lock file /var/lib/dpkg/lock-frontend".
      ExecStartPre=/usr/local/sbin/vcd-verify-layout.sh
      ExecStart=/usr/local/sbin/k8s-node-prereqs.sh
      RemainAfterExit=yes
      Restart=on-failure
      RestartSec=60
      TimeoutStartSec=30min

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/k8s-node-join.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Join the Kubernetes cluster as a worker
      Wants=network-online.target k8s-node-prereqs.service vcd-ensure-layout.service
      After=network-online.target k8s-node-prereqs.service vcd-ensure-layout.service
      ConditionPathExists=!/etc/kubernetes/kubeadm-joined
      StartLimitIntervalSec=0

      [Service]
      Type=oneshot
      ExecStartPre=/usr/local/sbin/vcd-verify-layout.sh
      ExecStart=/usr/local/sbin/k8s-node-join.sh
      RemainAfterExit=yes
      Restart=on-failure
      RestartSec=60
      TimeoutStartSec=45min

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Trust the pool's CA bundle before anything reaches the network: apt, the
  # Kubernetes repository and the container registry all use it.
  - update-ca-certificates
  # bootstrap.ntpServers: the Terraform baseline sets the same sources per
  # cluster. The block is marked so a re-run replaces it instead of appending.
  - |
    if [ -f /etc/chrony/chrony.conf ]; then
      sed -i '/^# BEGIN nodescale ntp$/,/^# END nodescale ntp$/d' /etc/chrony/chrony.conf
      {
        echo '# BEGIN nodescale ntp'
        echo 'server ntp1.example.com iburst'
        echo 'server ntp2.example.com iburst'
        echo '# END nodescale ntp'
      } >> /etc/chrony/chrony.conf
      systemctl restart chrony 2>/dev/null || true
    fi
  - systemctl daemon-reload
  - systemctl enable vcd-grow-disks.service vcd-ensure-layout.service
  - systemctl enable k8s-node-prereqs.service k8s-node-join.service
  # Prepare the data disks and reboot once, exactly like vCD after the
  # post-customization phase. The reboot is what makes /var and /var/lib mount
  # from fstab; on the next boot the enabled units install the packages and
  # join. A failed preparation does not reboot, so the VM stays inspectable.
  - /usr/local/sbin/prepare-data-disks.sh && /sbin/reboot
  # The sshd drop-in above is read at start, and the image's socket unit may be
  # the one that answers: restart all three the way the Terraform baseline does.
  - systemctl restart ssh ssh.socket ssh.service || true
