replicaCount: 1

image:
  repository: docker.io/werton13/vcd-k8s-node-controller
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# platform is the one platform this installation serves: vcd or vsphere.
#
# It is mandatory and has no default on purpose. An installation never changes
# its platform, and a pool may not pick the other one: the chart renders only
# this platform's credentials, and the controller registers only its factory.
# A vSphere installation therefore carries no vcd secret reference and cannot
# depend on a vcd tenant - and the other way round.
platform: ""

namespace:
  # One namespace per cluster, named after the product rather than the
  # platform. It holds the controller, its ServiceAccount/RBAC and the
  # platform credentials Secret.
  name: nodescale-system

# Installation-wide guest policy: the defaults every K8sWorkerPool inherits
# when its own spec.bootstrap leaves a field empty.
#
# The chart renders one ConfigMap (bootstrap.configMapName) whose bootstrap.yaml
# key has the same shape as spec.bootstrap. The controller reads it and embeds
# the values into each new worker's user-data, so a pool does not repeat a 6 KB
# CA bundle or a mirror list.
#
# bootstrap.defaults accepts:
#   ntpServers: [ntp1.example.com, ntp2.example.com]
#   sysctls: {net.core.rmem_max: "67108864"}
#   kernelModules: [nf_conntrack]
#   caBundleRef: {name: ..., key: ...}   (set automatically when caBundle is)
#   apt:
#     # The mirror replaces the image's package sources. Required on a network
#     # without internet access: the first apt call fails without it.
#     mirror: https://nexus.example.com/repository/ubuntu-noble
#     suites: [noble, noble-updates, noble-backports, noble-security]
#     components: [main, universe, restricted, multiverse]
#   containerd:
#     sandboxImage: registry.example.com/pause:3.9
#     insecureSkipVerify: false
#     mirrors:
#       docker.io: ["http://mirror.example.com"]
#       registry.k8s.io: ["http://mirror.example.com"]
#
# apt.suites and apt.components are optional: empty derives the suites from the
# guest's release codename and uses main universe restricted multiverse.
#
# A pool keeps its own value when it names one: these are defaults, not
# overrides. The values apply to workers created after the chart is upgraded;
# running workers keep the bootstrap they were created with.
bootstrap:
  configMapName: nodescale-bootstrap
  # create=false is for an installation that manages the same ConfigMap
  # elsewhere (Ansible, a GitOps repository): the controller still reads it,
  # the chart just does not own it.
  create: true
  defaults: {}
  # caBundle is a PEM bundle (one or more certificates). Install it with
  #   --set-file bootstrap.caBundle=/path/to/ca-bundle.pem
  # The chart stores it under the ca-bundle.pem key and points caBundleRef at
  # it, so no pool has to carry the text.
  caBundle: ""

# vCloud Director credentials. Used when platform is vcd; the whole block is
# ignored otherwise, and nothing from it is rendered.
#
# The Secret lives in the release namespace and uses discrete keys, one per
# setting:
#   url       https://vcd.example.com/api   (a bare host is accepted too)
#   user      a service account in the org below
#   password  its password
#   org       the organization the controller works in
#   vdc       the virtual data center the pools live in
#   insecure  true/false, whether to skip API certificate verification
#
# Example:
#   kubectl -n nodescale-system create secret generic vcd-credentials \
#     --from-literal=url=https://vcd.example.com/api \
#     --from-literal=user=svc-node-controller \
#     --from-literal=password='***' \
#     --from-literal=org=myorg \
#     --from-literal=vdc=My-VDC-Name \
#     --from-literal=insecure=false
vcd:
  existingSecret: vcd-credentials

# vSphere credentials. Used when platform is vsphere; the whole block is
# ignored otherwise, and nothing from it is rendered.
#
# The Secret holds only the connection, shared by every vSphere pool of the
# installation:
#   url       https://vcenter.example.com    (a bare host works too)
#   user      e.g. terraform@example.local
#   password  its password
#   insecure  true for a self-signed vCenter certificate
#
# Placement is per pool, in spec.vsphere: datacenter, cluster, resourcePool,
# folder, datastore, network. Those describe where one pool's workers live,
# not how the controller logs in, so they are read from the CR and never from
# this Secret.
#
# The format is deliberately not the CSI INI: discrete keys are easier to
# create, rotate and review. Where the cluster already has a
# vmware-system-csi/vsphere-config-secret, copy its three connection values
# out once (option A: the Secret is duplicated into our namespace; the
# controller is not granted read access to another namespace):
#
#   kubectl -n nodescale-system create secret generic vsphere-credentials \
#     --from-literal=url=https://vcenter.example.com \
#     --from-literal=user=terraform@example.local \
#     --from-literal=password='***' \
#     --from-literal=insecure=true
vsphere:
  existingSecret: vsphere-credentials
  # folderRoot is the folder no pool may leave (VSPHERE_FOLDER_ROOT), for
  # example "/HUB Infrastructure/dev/k8s-test-lab". It is the tenant boundary
  # and therefore a property of the installation, not of a pool: a pool that
  # names its own root would be naming its own limit. Empty enforces no
  # boundary, which is only appropriate for a dedicated vCenter account.
  folderRoot: ""

leaderElection: true

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Placement. Running the controller on the control plane is the recommended
# default once the pool may be emptied (scaleDown.minReplicas: 0 with
# scaleDown.allowLastWorker): on a worker, the last-worker guard refuses to
# delete the node the controller runs on, so the pool can never reach zero.
#
# Example control-plane placement:
#   nodeSelector:
#     node-role.kubernetes.io/control-plane: ""
#   tolerations:
#     - key: node-role.kubernetes.io/control-plane
#       operator: Exists
#       effect: NoSchedule
#   priorityClassName: system-cluster-critical
nodeSelector: {}
tolerations: []
affinity: {}

# priorityClassName raises the controller above the workloads it evicts: the
# drain it starts must not evict the controller itself.
priorityClassName: ""

# dnsPolicy is worth setting to Default when the controller runs on the control
# plane and CoreDNS may be pinned to a worker: at zero workers a worker-pinned
# CoreDNS has nowhere to run, and the controller still has to resolve the vCD
# API and the Kubernetes API.
dnsPolicy: ""

# Two replicas with leader election and a required anti-affinity make the
# controller survive a node removal. See README "Controller placement".

# Management UI (roadmap 11). A second container in the same Pod serving a page
# and a small API over the same K8sWorkerPool object: replicas, spec.flavor and
# removal of a named worker. It never talks to vCD - the controller stays the
# only thing that does - so every action is a CRD edit and every gate
# (minReplicas, allowLastWorker, the drain, the last-worker guard) still applies.
ui:
  enabled: false

  image:
    repository: "" # defaults to image.repository
    tag: "" # defaults to image.tag / .Chart.AppVersion
    pullPolicy: "" # defaults to image.pullPolicy

  port: 8090
  pathPrefix: /nodescale-ui
  # How often the snapshot is rebuilt: pools, pods, node capacity, exporter
  # scrapes. The page polls the snapshot, so it never waits for a scrape.
  refreshInterval: 15s

  # Real utilisation is scraped from node-exporter pods, and metrics.k8s.io is
  # the fallback. Neither is required: without both the third column shows a
  # dash instead of a number.
  nodeExporter:
    labelSelector: app.kubernetes.io/name=prometheus-node-exporter
    port: 9100

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Authentication. Two groups live in one Secret: admins may change the pool,
  # viewers may only read it. The page hides the controls, the server refuses
  # the request.
  auth:
    enabled: true
    secretName: nodescale-ui-auth
    key: users.yaml
    # A rotated password works without a restart.
    refreshInterval: 60s
    # How long a sign-in through the login form lasts. The cookie is signed with
    # a key derived from users.yaml, so changing any account ends every session.
    sessionTTL: 12h
    # createSecret writes the Secret on install when it does not exist yet: two
    # bcrypt hashes in users.yaml and the generated passwords in
    # initial-passwords for the operator to read once. An upgrade never
    # rotates them, and an existing Secret is left alone. Turn this off where
    # Ansible or an external secret store owns the Secret.
    createSecret: true
    adminUsername: admin
    viewerUsername: viewer

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: nginx
    # Empty host means catch-all: the page answers on any name, i.e.
    # http://<node-ip>:<ingress-http-nodeport>/nodescale-ui.
    host: ""
    path: /nodescale-ui
    annotations: {}
    tls:
      # A certificate is matched by SNI, so a named Secret needs a host: a
      # catch-all rule has no name to match. Leave both empty to serve HTTPS
      # with the ingress controller's own (self-signed) certificate.
      secretName: ""
      # Redirect plain HTTP to HTTPS. Off by default: behind NodePorts the
      # redirect drops the port and points at :443, which is not open here.
      redirect: false
