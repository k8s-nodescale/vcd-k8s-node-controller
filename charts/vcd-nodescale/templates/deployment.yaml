apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vcd-nodescale.fullname" . }}
  namespace: {{ include "vcd-nodescale.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "vcd-nodescale.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vcd-nodescale.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vcd-nodescale.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "vcd-nodescale.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "vcd-nodescale.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            # Downward API: the last-worker guard compares the request with the
            # Node this Pod runs on instead of guessing.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VCD_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: url
            - name: VCD_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: user
            - name: VCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: password
            - name: VCD_ORG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: org
            - name: VCD_VDC
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: vdc
            - name: VCD_INSECURE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: insecure
                  optional: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- if .Values.ui.enabled }}
        - name: ui
          image: {{ include "vcd-nodescale.uiImage" . }}
          imagePullPolicy: {{ default .Values.image.pullPolicy .Values.ui.image.pullPolicy }}
          command: ["/ui"]
          args:
            - --addr=:{{ .Values.ui.port }}
            - --path-prefix={{ .Values.ui.pathPrefix }}
            - --refresh-interval={{ .Values.ui.refreshInterval }}
            - --node-exporter-labels={{ .Values.ui.nodeExporter.labelSelector }}
            - --node-exporter-port={{ .Values.ui.nodeExporter.port }}
            - --auth-secret={{ .Values.ui.auth.secretName }}
            - --auth-secret-key={{ .Values.ui.auth.key }}
            - --auth-refresh={{ .Values.ui.auth.refreshInterval }}
            {{- if not .Values.ui.auth.enabled }}
            - --auth-disabled=true
            {{- end }}
          env:
            # The auth Secret lives in the Pod's own namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: ui
              containerPort: {{ .Values.ui.port }}
          livenessProbe:
            httpGet:
              path: {{ .Values.ui.pathPrefix }}/healthz
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ .Values.ui.pathPrefix }}/healthz
              port: ui
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
