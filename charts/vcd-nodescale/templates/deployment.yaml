apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vcd-nodescale.fullname" . }}
  namespace: {{ include "vcd-nodescale.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "vcd-nodescale.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vcd-nodescale.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vcd-nodescale.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "vcd-nodescale.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "vcd-nodescale.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            - name: VCD_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: url
            - name: VCD_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: user
            - name: VCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: password
            - name: VCD_ORG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: org
            - name: VCD_VDC
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: vdc
            - name: VCD_INSECURE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: insecure
                  optional: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
