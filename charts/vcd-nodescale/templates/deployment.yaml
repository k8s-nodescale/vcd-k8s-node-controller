{{- $platform := include "vcd-nodescale.platform" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vcd-nodescale.fullname" . }}
  namespace: {{ include "vcd-nodescale.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "vcd-nodescale.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vcd-nodescale.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vcd-nodescale.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "vcd-nodescale.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "vcd-nodescale.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            # Downward API: the last-worker guard compares the request with the
            # Node this Pod runs on instead of guessing.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The installation serves exactly one platform: this value selects
            # the only factory the process registers. A pool that asks for the
            # other platform is rejected as InvalidSpec.
            - name: NODESCALE_PLATFORM
              value: {{ $platform | quote }}
            {{- with .Values.bootstrap.configMapName }}
            # Installation-wide guest policy (NTP, CA bundle, sysctls,
            # containerd mirrors): a ConfigMap in this namespace with a
            # bootstrap.yaml key. A pool that leaves a field empty gets this
            # value; a pool that names one keeps its own.
            - name: NODESCALE_BOOTSTRAP_CONFIGMAP
              value: {{ . | quote }}
            {{- end }}
            {{- if eq $platform "vcd" }}
            # vCloud Director connection. Every key is optional at the kubelet
            # level so a missing Secret starts the Pod with a clear,
            # non-restarting condition instead of a CreateContainerConfigError:
            # the manager reports it on /readyz and on every affected pool.
            - name: VCD_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "vcd.existingSecret is required when platform is vcd" .Values.vcd.existingSecret }}
                  key: url
                  optional: true
            - name: VCD_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: user
                  optional: true
            - name: VCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: password
                  optional: true
            - name: VCD_ORG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: org
                  optional: true
            - name: VCD_VDC
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: vdc
                  optional: true
            - name: VCD_INSECURE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vcd.existingSecret }}
                  key: insecure
                  optional: true
            {{- else }}
            # vSphere connection, shared by every pool that sets
            # spec.provider: vsphere. The manager logs in on the first such
            # pool, so installing the controller before the account exists is
            # a condition on the pool, not a restart loop.
            - name: VSPHERE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "vsphere.existingSecret is required when platform is vsphere" .Values.vsphere.existingSecret }}
                  key: url
                  optional: true
            - name: VSPHERE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vsphere.existingSecret }}
                  key: user
                  optional: true
            - name: VSPHERE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vsphere.existingSecret }}
                  key: password
                  optional: true
            - name: VSPHERE_INSECURE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vsphere.existingSecret }}
                  key: insecure
                  optional: true
            # The folder boundary is not a credential: it is a policy of the
            # installation, so it stays a chart value and never enters the
            # Secret. The datacenter is per pool (spec.vsphere.datacenter).
            {{- with .Values.vsphere.folderRoot }}
            - name: VSPHERE_FOLDER_ROOT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- if .Values.ui.enabled }}
        - name: ui
          image: {{ include "vcd-nodescale.uiImage" . }}
          imagePullPolicy: {{ default .Values.image.pullPolicy .Values.ui.image.pullPolicy }}
          command: ["/ui"]
          args:
            - --addr=:{{ .Values.ui.port }}
            - --path-prefix={{ .Values.ui.pathPrefix }}
            - --refresh-interval={{ .Values.ui.refreshInterval }}
            - --node-exporter-labels={{ .Values.ui.nodeExporter.labelSelector }}
            - --node-exporter-port={{ .Values.ui.nodeExporter.port }}
            - --auth-secret={{ .Values.ui.auth.secretName }}
            - --auth-secret-key={{ .Values.ui.auth.key }}
            - --auth-refresh={{ .Values.ui.auth.refreshInterval }}
            - --auth-session-ttl={{ .Values.ui.auth.sessionTTL }}
            {{- if not .Values.ui.auth.enabled }}
            - --auth-disabled=true
            {{- end }}
          env:
            # The auth Secret lives in the Pod's own namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: ui
              containerPort: {{ .Values.ui.port }}
          livenessProbe:
            httpGet:
              path: {{ .Values.ui.pathPrefix }}/healthz
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ .Values.ui.pathPrefix }}/healthz
              port: ui
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
