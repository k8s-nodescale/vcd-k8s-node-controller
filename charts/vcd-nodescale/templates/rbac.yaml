{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vcd-nodescale.fullname" . }}-manager-role
rules:
  - apiGroups: ["infra.example.com"]
    resources: ["k8sworkerpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["infra.example.com"]
    resources: ["k8sworkerpools/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["infra.example.com"]
    resources: ["k8sworkerpools/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vcd-nodescale.fullname" . }}-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vcd-nodescale.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "vcd-nodescale.serviceAccountName" . }}
    namespace: {{ include "vcd-nodescale.namespace" . }}
{{- end }}
---
# kubeadm validates the API server identity through the JWS entries in the
# kube-public/cluster-info ConfigMap, so a bootstrap token created through the
# API is useless until its jws-kubeconfig-<id> entry is published there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vcd-nodescale.fullname" . }}-clusterinfo
  namespace: kube-public
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vcd-nodescale.fullname" . }}-clusterinfo
  namespace: kube-public
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vcd-nodescale.fullname" . }}-clusterinfo
subjects:
  - kind: ServiceAccount
    name: {{ include "vcd-nodescale.serviceAccountName" . }}
    namespace: {{ include "vcd-nodescale.namespace" . }}
