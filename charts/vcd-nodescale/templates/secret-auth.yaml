{{- if and .Values.ui.enabled .Values.ui.auth.enabled .Values.ui.auth.createSecret }}
{{- $ns := include "vcd-nodescale.namespace" . }}
{{- $name := .Values.ui.auth.secretName }}
{{- $admin := .Values.ui.auth.adminUsername }}
{{- $viewer := .Values.ui.auth.viewerUsername }}
{{- if not (lookup "v1" "Secret" $ns $name) }}
{{- $adminPw := randAlphaNum 24 }}
{{- $viewerPw := randAlphaNum 24 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ include "vcd-nodescale.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # The accounts outlive the release: an uninstall must not take the
    # passwords with it, and a reinstall must not rotate them.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Two groups, one file. Replace a password by putting its bcrypt hash here
  # (htpasswd -nB <user>); the page picks the change up within
  # ui.auth.refreshInterval, without a restart. A name in both groups is an
  # admin.
  users.yaml: |
    admins:
      - username: {{ $admin }}
        passwordHash: {{ htpasswd $admin $adminPw | trimPrefix (printf "%s:" $admin) | quote }}
    viewers:
      - username: {{ $viewer }}
        passwordHash: {{ htpasswd $viewer $viewerPw | trimPrefix (printf "%s:" $viewer) | quote }}
  # Read once, then delete this key: it is the only place the generated
  # passwords exist.
  initial-passwords: |
    {{ $admin }}: {{ $adminPw }}
    {{ $viewer }}: {{ $viewerPw }}
{{- end }}
{{- end }}
