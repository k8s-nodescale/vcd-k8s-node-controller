---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: k8sworkerpools.infra.example.com
spec:
  group: infra.example.com
  names:
    kind: K8sWorkerPool
    listKind: K8sWorkerPoolList
    plural: k8sworkerpools
    shortNames:
    - k8swp
    singular: k8sworkerpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Desired
      type: integer
    - jsonPath: .status.observedReplicas
      name: Observed
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.rollout.phase
      name: Rollout
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: K8sWorkerPool is the Schema for the k8sworkerpools API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: K8sWorkerPoolSpec defines the desired worker pool.
            properties:
              bootstrap:
                description: Bootstrap carries OS/cloud-init inputs used to render
                  new worker user-data.
                properties:
                  dns:
                    items:
                      type: string
                    type: array
                  k8sMinorRepo:
                    type: string
                  k8sVersion:
                    type: string
                  nicName:
                    type: string
                  osPasswordHash:
                    type: string
                  osUser:
                    type: string
                  sshAuthorizedKey:
                    type: string
                type: object
              flavor:
                description: |-
                  Flavor describes the compute and disk shape of a worker. It is the
                  source of truth for a rollout: a worker whose VM does not match it is a
                  resize candidate (see spec.rollout).
                properties:
                  cpus:
                    format: int32
                    minimum: 1
                    type: integer
                  disks:
                    description: Disks are additional data disks (mirrors Terraform
                      diskw1/diskw2).
                    items:
                      description: DiskSpec describes an internal disk attached to
                        a worker VM.
                      properties:
                        busNumber:
                          format: int32
                          type: integer
                        busType:
                          type: string
                        mount:
                          type: string
                        sizeGB:
                          format: int32
                          type: integer
                        storageProfile:
                          type: string
                        unitNumber:
                          format: int32
                          type: integer
                      required:
                      - sizeGB
                      type: object
                    type: array
                  memoryMB:
                    format: int32
                    minimum: 512
                    type: integer
                  osDiskGB:
                    description: |-
                      OSDiskGB overrides the system disk (bus 0/unit 0) of the cloned
                      template. Zero keeps the template size. Terraform-created workers use
                      disks_config.osdisk.sizegb; without this field a cloned worker inherits
                      the catalog template disk (10 GB on Ubuntu-24.04-ENG-Server).
                    format: int32
                    minimum: 0
                    type: integer
                  template:
                    description: Template is the vCD catalog template name.
                    type: string
                required:
                - cpus
                - memoryMB
                type: object
              ingressPool:
                description: IngressPool describes the load-balancer pool new workers
                  join once Ready.
                properties:
                  edge:
                    description: |-
                      Edge is the NSX-V edge gateway that owns the pool. NSX-V pools belong to
                      an edge gateway, so member removal needs it.
                    type: string
                  name:
                    type: string
                  port:
                    description: |-
                      Port is the node port the pool forwards to (not the virtual-server
                      port): NSX-V pool members point at the NodePort of the ingress
                      controller.
                    format: int32
                    type: integer
                  type:
                    enum:
                    - nsxv
                    - nsxt
                    - ""
                    type: string
                type: object
              ipPlan:
                description: |-
                  IPPlan mirrors the Terraform ip_plan variable so the controller
                  never collides with Terraform-managed infrastructure or reserved VIPs.
                properties:
                  cidr:
                    type: string
                  dvmOffset:
                    type: integer
                  ingressLB:
                    type: integer
                  kubeapiLB:
                    type: integer
                  mNodeOffset:
                    type: integer
                  masterCount:
                    format: int32
                    type: integer
                  reserved:
                    items:
                      type: string
                    type: array
                  wNodeOffset:
                    type: integer
                required:
                - cidr
                type: object
              join:
                description: Join controls how new nodes join the cluster.
                properties:
                  endpoint:
                    description: Endpoint is the control-plane address, e.g. 192.168.100.2:6443.
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels applied to the Node after join.
                    type: object
                  taints:
                    description: Taints applied to the Node after join (e.g. "key=value:NoSchedule").
                    items:
                      type: string
                    type: array
                  tokenTTL:
                    description: TokenTTL is how long the on-demand bootstrap token
                      remains valid.
                    type: string
                type: object
              namePrefix:
                description: NamePrefix is the DNS-safe prefix used to build worker
                  names (e.g. myorg-cluster-prod).
                type: string
              reconciliation:
                description: |-
                  Reconciliation controls what happens when a worker's VM disappears
                  outside the controller (deleted by hand in vCD, or lost with a vCD
                  failure). The default, Notify, keeps the slot reserved and reports it.
                properties:
                  autoHealBackoff:
                    default: 2m
                    description: |-
                      AutoHealBackoff is the minimum time between two AutoHeal attempts for
                      the same slot.
                    type: string
                  autoHealRetries:
                    default: 3
                    description: |-
                      AutoHealRetries is how many recreations AutoHeal attempts for a slot
                      before parking it as Failed. Only used with policy AutoHeal.
                    format: int32
                    minimum: 1
                    type: integer
                  policy:
                    default: Notify
                    description: Policy is Notify or AutoHeal.
                    enum:
                    - Notify
                    - AutoHeal
                    type: string
                type: object
              replicas:
                description: Replicas is the desired number of worker nodes.
                format: int32
                minimum: 0
                type: integer
              rollout:
                description: |-
                  Rollout controls compute-spec changes (CPU, memory, system disk). The
                  zero value means a Rolling rollout, one worker at a time.
                properties:
                  maxUnavailable:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 1
                    description: |-
                      MaxUnavailable bounds how many workers may be out of service at once.
                      It is an upper bound only: PodDisruptionBudgets are the real brake.
                    x-kubernetes-int-or-string: true
                  order:
                    default: Descending
                    description: |-
                      Order picks which end of the pool is rolled first. Descending (the
                      default) resizes the highest ordinal first, so wrk-01 moves last.
                    enum:
                    - Descending
                    - Ascending
                    type: string
                  pauseOnFailure:
                    default: true
                    description: PauseOnFailure stops the rollout when a worker does
                      not come back.
                    type: boolean
                  readyTimeout:
                    default: 10m
                    description: ReadyTimeout bounds how long a resized worker may
                      take to become Ready.
                    type: string
                  strategy:
                    default: Rolling
                    description: |-
                      Strategy is Rolling (resize automatically) or Manual (only workers
                      annotated infra.example.com/resize=allow are resized).
                    enum:
                    - Rolling
                    - Manual
                    type: string
                type: object
              scaleDown:
                description: ScaleDown controls safe removal of workers.
                properties:
                  allowLastWorker:
                    description: |-
                      AllowLastWorker permits a request that would leave the pool with zero
                      workers. Emptying the pool is a deliberate owner decision: every pod on
                      the last worker is evicted (PDBs still decide whether it can finish) and
                      the cluster keeps only the control plane. It requires minReplicas: 0.
                      Two refusals survive the flag because they are not policy: the worker
                      this controller itself runs on, and a worker holding node-local volumes.
                    type: boolean
                  deleteWorkers:
                    description: |-
                      DeleteWorkers names specific workers to remove, in order, regardless of
                      their position in the pool. An entry is processed like a scale-down:
                      cordon, ingress-pool removal, PDB-aware drain, volume-detach check, then
                      node and VM deletion. When the worker is gone the entry is removed from
                      this list and spec.replicas is decremented, so the worker is not
                      recreated. Unknown names are dropped with a warning event; naming a
                      worker that is already gone only aligns spec.replicas with reality.
                    items:
                      type: string
                    type: array
                  drainTimeout:
                    type: string
                  force:
                    description: |-
                      Force skips the data-loss guard for node-local volumes (hostPath/local
                      PVs that would become unreadable). It never skips PDBs or the detach
                      check. The same can be requested per node with the annotation
                      infra.example.com/force-delete=true.
                    type: boolean
                  minReplicas:
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              vcd:
                description: VCD points at the target vCloud Director objects.
                properties:
                  catalog:
                    type: string
                  catalogOrg:
                    type: string
                  org:
                    type: string
                  orgNetwork:
                    type: string
                  vapp:
                    type: string
                  vdc:
                    type: string
                required:
                - org
                - orgNetwork
                - vapp
                - vdc
                type: object
            required:
            - flavor
            - ipPlan
            - namePrefix
            - replicas
            - vcd
            type: object
          status:
            description: K8sWorkerPoolStatus is the observed state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              ledger:
                description: IPLedger is the persistent IP allocation ledger.
                properties:
                  free:
                    items:
                      type: string
                    type: array
                  nextIndex:
                    type: integer
                  used:
                    items:
                      type: string
                    type: array
                type: object
              nodes:
                items:
                  description: WorkerNodeStatus describes a single managed worker.
                  properties:
                    cpu:
                      format: int32
                      type: integer
                    deleteStartedAt:
                      description: |-
                        DeleteStartedAt anchors the scaleDown.drainTimeout budget for a worker
                        that is being removed. It is cleared when the worker leaves status.
                      format: date-time
                      type: string
                    diskGB:
                      format: int32
                      type: integer
                    flavor:
                      description: |-
                        Flavor is what the VM actually runs with, read back from vCD. It is the
                        rollout's observed side: spec.flavor is the desired side.
                      properties:
                        cpus:
                          format: int32
                          type: integer
                        memoryMB:
                          format: int32
                          type: integer
                        osDiskGB:
                          format: int32
                          type: integer
                      type: object
                    healAttempts:
                      description: |-
                        HealAttempts counts AutoHeal attempts for a missing slot. It is reset
                        when the slot becomes Ready again.
                      format: int32
                      type: integer
                    healLastAttempt:
                      description: HealLastAttempt is when AutoHeal last acted on
                        this slot.
                      format: date-time
                      type: string
                    ip:
                      type: string
                    k8sReady:
                      type: boolean
                    kubeletVersion:
                      type: string
                    memoryMB:
                      format: int32
                      type: integer
                    message:
                      type: string
                    name:
                      description: |-
                        Name is the vCD VM name, e.g. KION-WEB-DEV-wrk-03: it keeps the case of
                        spec.namePrefix because that is how vCD stores it.
                      type: string
                    nodeName:
                      description: |-
                        NodeName is the name of the Kubernetes Node object as kubelet registered
                        it, always lower case. Every Kubernetes call (cordon, drain, volume
                        detach wait, Node delete) must use this name: passing Name asks for an
                        object that does not exist and the call silently does nothing.
                      type: string
                    phase:
                      description: NodePhase describes the lifecycle phase of a managed
                        worker node.
                      enum:
                      - Pending
                      - Provisioning
                      - Joining
                      - Ready
                      - Missing
                      - Resizing
                      - Draining
                      - Deleting
                      - Failed
                      type: string
                    resize:
                      description: Resize tracks the rollout of this worker, when
                        one is in progress.
                      properties:
                        message:
                          type: string
                        phase:
                          description: |-
                            Phase is Cordoned, Draining, Stopped, Resizing, Booting, WaitingReady,
                            Done or Failed.
                          type: string
                        startedAt:
                          format: date-time
                          type: string
                      type: object
                    vmID:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              observedReplicas:
                format: int32
                type: integer
              rollout:
                description: RolloutStatus is the pool-wide rollout state.
                properties:
                  currentWorker:
                    type: string
                  lastError:
                    type: string
                  phase:
                    description: Phase is Idle, Progressing, Paused or Failed.
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                  targetFlavor:
                    description: FlavorStatus is the compute shape a VM runs with,
                      as reported by vCD.
                    properties:
                      cpus:
                        format: int32
                        type: integer
                      memoryMB:
                        format: int32
                        type: integer
                      osDiskGB:
                        format: int32
                        type: integer
                    type: object
                  workersDone:
                    format: int32
                    type: integer
                  workersTotal:
                    format: int32
                    type: integer
                type: object
            required:
            - observedReplicas
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
