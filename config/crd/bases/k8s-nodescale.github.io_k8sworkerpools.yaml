---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: k8sworkerpools.k8s-nodescale.github.io
spec:
  group: k8s-nodescale.github.io
  names:
    kind: K8sWorkerPool
    listKind: K8sWorkerPoolList
    plural: k8sworkerpools
    shortNames:
    - k8swp
    singular: k8sworkerpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Desired
      type: integer
    - jsonPath: .status.observedReplicas
      name: Observed
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.rollout.phase
      name: Rollout
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: K8sWorkerPool is the Schema for the k8sworkerpools API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: K8sWorkerPoolSpec defines the desired worker pool.
            properties:
              bootstrap:
                description: Bootstrap carries OS/cloud-init inputs used to render
                  new worker user-data.
                properties:
                  dns:
                    items:
                      type: string
                    type: array
                  k8sMinorRepo:
                    type: string
                  k8sVersion:
                    type: string
                  nicName:
                    type: string
                  osPasswordHash:
                    type: string
                  osUser:
                    type: string
                  sshAuthorizedKey:
                    type: string
                type: object
              capacity:
                description: |-
                  Capacity controls the pre-flight check against the vDC's free capacity.
                  The zero value keeps the check on.
                properties:
                  cpuMhzPerCore:
                    default: 2000
                    description: |-
                      CPUMHzPerCore converts a vCPU into the MHz the vDC rates CPU capacity
                      in. It is used only when the vDC does not report its own speed to the
                      controller account (the tenant view does not carry it, the admin view
                      does). The default, 2000, is the usual 2 GHz per vCPU.
                    format: int64
                    minimum: 100
                    type: integer
                  preflight:
                    default: true
                    description: |-
                      Preflight refuses to start a create or a resize that cannot fit in the
                      vDC's free capacity. The default is on. Turn it off only on a tenant
                      whose reported capacity does not match what vCD enforces.
                    type: boolean
                type: object
              flavor:
                description: |-
                  Flavor describes the compute and disk shape of a worker. It is the
                  source of truth for a rollout: a worker whose VM does not match it is a
                  resize candidate (see spec.rollout).
                properties:
                  cpus:
                    format: int32
                    minimum: 1
                    type: integer
                  disks:
                    description: Disks are additional data disks (mirrors Terraform
                      diskw1/diskw2).
                    items:
                      description: DiskSpec describes an internal disk attached to
                        a worker VM.
                      properties:
                        busNumber:
                          format: int32
                          type: integer
                        busType:
                          type: string
                        mount:
                          type: string
                        sizeGB:
                          format: int32
                          type: integer
                        storageProfile:
                          type: string
                        unitNumber:
                          format: int32
                          type: integer
                      required:
                      - sizeGB
                      type: object
                    type: array
                  memoryMB:
                    format: int32
                    minimum: 512
                    type: integer
                  osDiskGB:
                    description: |-
                      OSDiskGB overrides the system disk (bus 0/unit 0) of the cloned
                      template. Zero keeps the template size. Terraform-created workers use
                      disks_config.osdisk.sizegb; without this field a cloned worker inherits
                      the catalog template disk (10 GB on Ubuntu-24.04-ENG-Server).
                    format: int32
                    minimum: 0
                    type: integer
                  template:
                    description: Template is the vCD catalog template name.
                    type: string
                required:
                - cpus
                - memoryMB
                type: object
              ingressPool:
                description: IngressPool describes the load-balancer pool new workers
                  join once Ready.
                properties:
                  edge:
                    description: |-
                      Edge is the NSX-V edge gateway that owns the pool. NSX-V pools belong to
                      an edge gateway, so member removal needs it.
                    type: string
                  name:
                    type: string
                  port:
                    description: |-
                      Port is the node port the pool forwards to (not the virtual-server
                      port): NSX-V pool members point at the NodePort of the ingress
                      controller.
                    format: int32
                    type: integer
                  type:
                    enum:
                    - nsxv
                    - nsxt
                    - ""
                    type: string
                type: object
              ipPlan:
                description: |-
                  IPPlan mirrors the Terraform ip_plan variable so the controller
                  never collides with Terraform-managed infrastructure or reserved VIPs.
                properties:
                  cidr:
                    type: string
                  ingressLB:
                    type: integer
                  kubeapiLB:
                    type: integer
                  mNodeOffset:
                    type: integer
                  masterCount:
                    format: int32
                    type: integer
                  reserved:
                    items:
                      type: string
                    type: array
                  wNodeOffset:
                    type: integer
                required:
                - cidr
                type: object
              join:
                description: Join controls how new nodes join the cluster.
                properties:
                  endpoint:
                    description: Endpoint is the control-plane address, e.g. 192.168.100.2:6443.
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels applied to the Node after join.
                    type: object
                  taints:
                    description: Taints applied to the Node after join (e.g. "key=value:NoSchedule").
                    items:
                      type: string
                    type: array
                  tokenTTL:
                    description: TokenTTL is how long the on-demand bootstrap token
                      remains valid.
                    type: string
                type: object
              namePrefix:
                description: NamePrefix is the DNS-safe prefix used to build worker
                  names (e.g. myorg-cluster-prod).
                type: string
              provider:
                default: vcd
                description: |-
                  Provider selects the platform that runs this pool's workers: vcd (the
                  default) or vsphere. The platform block that matches it is required;
                  the others are ignored.
                enum:
                - vcd
                - vsphere
                type: string
              provisioning:
                description: |-
                  Provisioning bounds the window between "the VM exists" and "kubelet has
                  registered a Node". A worker that stays in that window longer is parked
                  as Failed so the pool reports it instead of waiting forever.
                properties:
                  timeout:
                    default: 15m
                    description: |-
                      Timeout is how long a worker may sit in Provisioning with a VM but no
                      Kubernetes Node object. When it elapses the worker's phase becomes
                      Failed and the pool reports Ready=False/WorkerFailed; the VM is left
                      running for inspection, and a late registration still promotes the
                      worker to Ready. The default is 15m; a zero value means the default.
                    type: string
                type: object
              reconciliation:
                description: |-
                  Reconciliation controls what happens when a worker's VM disappears
                  outside the controller (deleted by hand in vCD, or lost with a vCD
                  failure). The default, Notify, keeps the slot reserved and reports it.
                properties:
                  autoHealBackoff:
                    default: 2m
                    description: |-
                      AutoHealBackoff is the minimum time between two AutoHeal attempts for
                      the same slot.
                    type: string
                  autoHealRetries:
                    default: 3
                    description: |-
                      AutoHealRetries is how many recreations AutoHeal attempts for a slot
                      before parking it as Failed. Only used with policy AutoHeal.
                    format: int32
                    minimum: 1
                    type: integer
                  policy:
                    default: Notify
                    description: Policy is Notify or AutoHeal.
                    enum:
                    - Notify
                    - AutoHeal
                    type: string
                type: object
              replicas:
                description: Replicas is the desired number of worker nodes.
                format: int32
                minimum: 0
                type: integer
              rollout:
                description: |-
                  Rollout controls compute-spec changes (CPU, memory, system disk). The
                  zero value means a Rolling rollout, one worker at a time.
                properties:
                  maxUnavailable:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 1
                    description: |-
                      MaxUnavailable bounds how many workers may be out of service at once.
                      It is an upper bound only: PodDisruptionBudgets are the real brake.
                    x-kubernetes-int-or-string: true
                  order:
                    default: Descending
                    description: |-
                      Order picks which end of the pool is rolled first. Descending (the
                      default) resizes the highest ordinal first, so wrk-01 moves last.
                    enum:
                    - Descending
                    - Ascending
                    type: string
                  pauseOnFailure:
                    default: true
                    description: PauseOnFailure stops the rollout when a worker does
                      not come back.
                    type: boolean
                  readyTimeout:
                    default: 10m
                    description: ReadyTimeout bounds how long a resized worker may
                      take to become Ready.
                    type: string
                  strategy:
                    default: Rolling
                    description: |-
                      Strategy is Rolling (resize automatically) or Manual (only workers
                      annotated k8s-nodescale.github.io/resize=allow are resized).
                    enum:
                    - Rolling
                    - Manual
                    type: string
                type: object
              scaleDown:
                description: ScaleDown controls safe removal of workers.
                properties:
                  allowLastWorker:
                    default: false
                    description: |-
                      AllowLastWorker permits a request that would leave the pool with zero
                      workers. Emptying the pool is a deliberate owner decision: every pod on
                      the last worker is evicted, and a budget that blocks the drain is
                      bypassed after drainTimeout unless waitForPDB asks for a human. It
                      requires minReplicas: 0; a spec that sets this flag with a higher floor
                      is rejected as InvalidSpec instead of accepting a flag that could never
                      be honoured. Two refusals survive the flag because they are not policy:
                      the worker this controller itself runs on, and a worker holding
                      node-local volumes.
                    type: boolean
                  deleteWorkers:
                    description: |-
                      DeleteWorkers names specific workers to remove, in order, regardless of
                      their position in the pool. An entry is processed like a scale-down:
                      cordon, ingress-pool removal, PDB-aware drain, volume-detach check, then
                      node and VM deletion. When the worker is gone the entry is removed from
                      this list and spec.replicas is decremented, so the worker is not
                      recreated. Unknown names are dropped with a warning event; naming a
                      worker that is already gone only aligns spec.replicas with reality.
                    items:
                      type: string
                    type: array
                  drainTimeout:
                    type: string
                  force:
                    default: false
                    description: |-
                      Force skips the data-loss guard for node-local volumes (hostPath/local
                      PVs that would become unreadable). It never skips PDBs or the detach
                      check; a budget is bypassed only by the escalation described on
                      WaitForPDB. The same can be requested per node with the annotation
                      k8s-nodescale.github.io/force-delete=true.
                    type: boolean
                  minReplicas:
                    default: 1
                    description: |-
                      MinReplicas is the floor for the workers that can serve traffic. A
                      removal that would take a serving worker out and leave fewer than this
                      many is refused; writing off a slot whose VM is already gone takes
                      nothing out of service and is never refused by the floor. It defaults to
                      1: emptying the pool has to be asked for with minReplicas: 0.
                    format: int32
                    minimum: 0
                    type: integer
                  waitForPDB:
                    default: false
                    description: |-
                      WaitForPDB keeps the worker in Failed when drainTimeout is spent and a
                      PodDisruptionBudget still allows no disruption. By default the removal
                      escalates instead: the pods that are left are deleted through the API
                      (not the eviction API), so a single-replica workload whose
                      minAvailable equals its replica count cannot pin a worker the pool has
                      to remove. The event and the status message name every budget that was
                      bypassed. Set this where a PDB must never be overridden and a human
                      should decide.
                    type: boolean
                type: object
              vcd:
                description: |-
                  VCD points at the target vCloud Director objects. Required when
                  spec.provider is vcd (the default), ignored otherwise.
                properties:
                  catalog:
                    type: string
                  catalogOrg:
                    type: string
                  dvmOffset:
                    description: |-
                      DVMOffset is the address offset of the deployment VM, the bootstrap
                      host Terraform creates. The controller reserves that address so no
                      worker is ever handed it. It lives here rather than in spec.ipPlan
                      because only the vCD bootstrap has a DVM; the address plan itself is
                      provider-neutral.
                    type: integer
                  org:
                    type: string
                  orgNetwork:
                    type: string
                  vapp:
                    type: string
                  vdc:
                    type: string
                required:
                - org
                - orgNetwork
                - vapp
                - vdc
                type: object
            required:
            - flavor
            - ipPlan
            - namePrefix
            - replicas
            type: object
          status:
            description: K8sWorkerPoolStatus is the observed state.
            properties:
              capacity:
                description: |-
                  Capacity is the platform's own view of the vDC the pool lives in: what is used and what the vDC caps, plus the pod subnet budget. It is a snapshot, taken when a scale operation completed and refreshed on a slow timer.
                properties:
                  at:
                    format: date-time
                    type: string
                  cpuLimitMHz:
                    format: int64
                    type: integer
                  cpuMHz:
                    format: int64
                    type: integer
                  memoryLimitMB:
                    format: int64
                    type: integer
                  memoryMB:
                    format: int64
                    type: integer
                  model:
                    type: string
                  observedReplicas:
                    format: int32
                    type: integer
                  podSubnet:
                    type: string
                  podSubnetsTotal:
                    format: int32
                    type: integer
                  podSubnetsUsed:
                    format: int32
                    type: integer
                  storageLimitMB:
                    format: int64
                    type: integer
                  storageMB:
                    format: int64
                    type: integer
                  storageName:
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              ledger:
                description: IPLedger is the persistent IP allocation ledger.
                properties:
                  free:
                    items:
                      type: string
                    type: array
                  nextIndex:
                    type: integer
                  used:
                    items:
                      type: string
                    type: array
                type: object
              nodes:
                items:
                  description: WorkerNodeStatus describes a single managed worker.
                  properties:
                    bootstrapTokenID:
                      description: |-
                        BootstrapTokenID is the id of the bootstrap token this worker's guest was
                        given at create time: the half of "id.secret" that is not a credential by
                        itself. It lets the controller renew a slow install and revoke the token
                        once the Node is Ready without keeping the secret half in status.
                      type: string
                    cpu:
                      format: int32
                      type: integer
                    deleteStartedAt:
                      description: |-
                        DeleteStartedAt anchors the scaleDown.drainTimeout budget for a worker
                        that is being removed. It is cleared when the worker leaves status.
                      format: date-time
                      type: string
                    diskGB:
                      format: int32
                      type: integer
                    flavor:
                      description: |-
                        Flavor is what the VM actually runs with, read back from vCD. It is the
                        rollout's observed side: spec.flavor is the desired side.
                      properties:
                        cpus:
                          format: int32
                          type: integer
                        memoryMB:
                          format: int32
                          type: integer
                        osDiskGB:
                          format: int32
                          type: integer
                        template:
                          description: |-
                            Template is the image the VM was cloned from, recorded on the VM when
                            the provider creates it. A worker the controller adopted (a Terraform
                            bootstrap worker) carries no such record, so this stays empty and means
                            "no opinion": an unknown image never turns adoption into a recreate.
                          type: string
                      type: object
                    healAttempts:
                      description: |-
                        HealAttempts counts AutoHeal attempts for a missing slot. It is reset
                        when the slot becomes Ready again.
                      format: int32
                      type: integer
                    healLastAttempt:
                      description: HealLastAttempt is when AutoHeal last acted on
                        this slot.
                      format: date-time
                      type: string
                    ip:
                      type: string
                    k8sReady:
                      type: boolean
                    kubeletVersion:
                      type: string
                    memoryMB:
                      format: int32
                      type: integer
                    message:
                      type: string
                    name:
                      description: |-
                        Name is the vCD VM name, e.g. KION-WEB-DEV-wrk-03: it keeps the case of
                        spec.namePrefix because that is how vCD stores it.
                      type: string
                    nodeName:
                      description: |-
                        NodeName is the name of the Kubernetes Node object as kubelet registered
                        it, always lower case. Every Kubernetes call (cordon, drain, volume
                        detach wait, Node delete) must use this name: passing Name asks for an
                        object that does not exist and the call silently does nothing.
                      type: string
                    phase:
                      description: NodePhase describes the lifecycle phase of a managed
                        worker node.
                      enum:
                      - Pending
                      - Provisioning
                      - Joining
                      - Ready
                      - Missing
                      - Resizing
                      - Queued
                      - Draining
                      - Deleting
                      - Failed
                      type: string
                    providerID:
                      description: |-
                        ProviderID is the VM's identifier in the underlying platform, in the
                        form that platform owns (today: the vCD VM id, urn:vcloud:vm:...).
                        The controller only hands it back to the provider, so a second
                        platform needs no change to this field.
                      type: string
                    provisioningStartedAt:
                      description: |-
                        ProvisioningStartedAt is when this worker entered Provisioning, i.e.
                        when the controller began waiting for kubelet to register a Node for an
                        existing VM. It anchors spec.provisioning.timeout and is cleared once
                        the Node exists. A worker adopted with a registered Node never gets it.
                      format: date-time
                      type: string
                    resize:
                      description: Resize tracks the rollout of this worker, when
                        one is in progress.
                      properties:
                        drainStartedAt:
                          description: |-
                            DrainStartedAt is when the drain of this worker began. The roll spends
                            scaleDown.drainTimeout from here and then escalates the way a scale-down
                            does, so a PodDisruptionBudget with no possible disruption cannot pin a
                            compute change forever (I-21).
                          format: date-time
                          type: string
                        message:
                          type: string
                        phase:
                          description: |-
                            Phase is Cordoned, Stopped, Booting or Failed for a change applied in
                            place, and Cordoned, Deleting, Creating, Booting or Failed for a worker
                            that is replaced (Recreate).
                          type: string
                        recreate:
                          description: |-
                            Recreate is set when spec.flavor cannot be reached in place - a shrink,
                            a mix of grow and shrink, or another template - so the worker is
                            replaced instead: drained, deleted and created again under the same
                            name at the same address.
                          type: boolean
                        startedAt:
                          format: date-time
                          type: string
                      type: object
                  required:
                  - name
                  type: object
                type: array
              observedReplicas:
                format: int32
                type: integer
              rollout:
                description: RolloutStatus is the pool-wide rollout state.
                properties:
                  currentWorker:
                    type: string
                  lastError:
                    type: string
                  message:
                    description: |-
                      Message explains a roll that is not making progress, e.g. the capacity
                      it is waiting for.
                    type: string
                  phase:
                    description: Phase is Idle, Progressing, Paused, Queued or Failed.
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                  targetFlavor:
                    description: |-
                      FlavorStatus is what a worker actually runs with, as the platform reports
                      it: the observed side of spec.flavor. The rollout compares the two and asks
                      for work only where they differ.
                    properties:
                      cpus:
                        format: int32
                        type: integer
                      memoryMB:
                        format: int32
                        type: integer
                      osDiskGB:
                        format: int32
                        type: integer
                      template:
                        description: |-
                          Template is the image the VM was cloned from, recorded on the VM when
                          the provider creates it. A worker the controller adopted (a Terraform
                          bootstrap worker) carries no such record, so this stays empty and means
                          "no opinion": an unknown image never turns adoption into a recreate.
                        type: string
                    type: object
                  workersDone:
                    format: int32
                    type: integer
                  workersTotal:
                    format: int32
                    type: integer
                type: object
            required:
            - observedReplicas
            type: object
        type: object
    served: true
    storage: true
    subresources:
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.observedReplicas
      status: {}
