# A pool on a vSphere installation (platform: vsphere).
#
# This object describes a worker set that already exists, so the first apply is
# a handover, not a scale-up: `replicas` is the current worker count, and
# `namePrefix` / `folder` / `ipPlan` must reproduce what is already running.
# The README section "Writing a K8sWorkerPool for an existing cluster" explains
# where every value can be read.
apiVersion: k8s-nodescale.github.io/v1alpha1
kind: K8sWorkerPool
metadata:
  name: lab-cluster
spec:
  replicas: 3
  namePrefix: lab-cluster            # nodes are <prefix>-wrk-NN
  provider: vsphere                  # optional: empty means the installation's platform
  vsphere:
    datacenter: MSK_Dev_DC           # required; no process-wide fallback
    cluster: mskdev                  # the compute cluster; its hosts are the capacity
    folder: /HUB Infrastructure/dev/k8s-test-lab
    datastore: 99DOR13_DEV_NFS_L11
    network: Avantage_VL_DEV_MGMT_CNO-330
    # resourcePool: ""               # empty means the cluster's root pool
  bootstrap:
    osUser: ubuntu
    nicName: ens192
    dns:
      - 10.74.64.91
      - 10.73.1.45
    k8sVersion: "1.28.15-1.1"
    k8sMinorRepo: "v1.28"
  flavor:
    template: noble-template_1.1.0_k8s
    cpus: 8
    memoryMB: 4096
    osDiskGB: 40
    disks:
      - sizeGB: 60
        mount: /var/lib
        busType: paravirtual
        busNumber: 1
        unitNumber: 0
  ipPlan:
    cidr: 10.99.96.64/26
    vmIPOffset: 35                   # 10.99.96.64 + 35 = the VM range starts at .99
    dvmOffset: 2                     # .101
    kubeapiLB: 3                     # .102
    lbNodeOffset: 5                  # .104
    lbNodeCount: 2                   # .104-.105
    mNodeOffset: 7                   # .106
    masterCount: 3                   # .106-.108
    wNodeOffset: 10                  # .109
    nodeCount: 17                    # .109-.125 (the gateway .65 is never shifted)
    # reserved: ["10.99.96.126"]
  join:
    endpoint: 10.99.96.102:6443
    tokenTTL: 1h
    labels:
      node-role.kubernetes.io/worker: ""
  scaleDown:
    minReplicas: 1
    drainTimeout: 10m
