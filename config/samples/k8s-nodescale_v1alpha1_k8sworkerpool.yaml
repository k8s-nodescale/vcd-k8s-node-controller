apiVersion: k8s-nodescale.github.io/v1alpha1
kind: K8sWorkerPool
metadata:
  name: default
spec:
  replicas: 2
  namePrefix: myorg-cluster-prod
  provider: vcd
  bootstrap:
    osUser: ubuntu
    osPasswordHash: "$6$REPLACE_WITH_HASH"
    sshAuthorizedKey: "ssh-ed25519 AAAA... user@example"
    nicName: ens192
    dns:
      - 77.88.8.8
      - 77.88.8.1
    k8sVersion: "1.35.9-1.1"
    k8sMinorRepo: "v1.35"
  flavor:
    cpus: 4
    memoryMB: 8192
    template: ubuntu24.04-uuid-enabled-v1
    disks:
      - sizeGB: 10
        mount: /var
        busType: paravirtual
        busNumber: 1
        unitNumber: 0
      - sizeGB: 30
        mount: /var/lib
        busType: paravirtual
        busNumber: 1
        unitNumber: 1
  vcd:
    org: myorg
    vdc: My-VDC-Name
    vapp: k8s-lab-vapp
    orgNetwork: routed-k8s-net
    catalog: Templates
  ipPlan:
    cidr: 192.168.100.0/24
    dvmOffset: 2          # .2  - the Terraform bootstrap host
    kubeapiLB: 3          # .3  - the API VIP
    ingressLB: 4          # .4  - optional ingress VIP
    lbNodeOffset: 5       # .5  - first load-balancer VM
    lbNodeCount: 2        # .5-.6
    mNodeOffset: 7        # .7  - first master
    masterCount: 3        # .7-.9
    wNodeOffset: 10       # .10 - first worker
    nodeCount: 10         # .10-.19
    reserved:
      - 192.168.100.200
  join:
    endpoint: 192.168.100.3:6443
    tokenTTL: 1h
    labels:
      node-role.kubernetes.io/worker: ""
  ingressPool:
    type: nsxv
    name: myorg-k8s-cluster-prod-ingress-pool
    port: 443
  scaleDown:
    minReplicas: 2
    drainTimeout: 10m
    # Emptying the pool needs minReplicas: 0 *and* allowLastWorker: true.
    # Both flags are written into every object by the CRD defaults, so they
    # are visible in `kubectl get -o yaml` even when left unset here.
    allowLastWorker: false
    # false: a drain the PDB blocks is escalated after drainTimeout.
    # true: the worker is parked in Failed and a human decides.
    waitForPDB: false
